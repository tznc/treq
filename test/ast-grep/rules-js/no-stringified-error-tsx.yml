id: no-stringified-error-tsx
language: tsx
severity: error
message: >
  Do not stringify a caught error with String(err), `${err}`, "..." + err or
  err.toString(), or cast it with `err as Error` (or any other type): the
  string drops the stack and cause, and the cast is unchecked. Narrow with
  `err instanceof Error`, rethrow with `new Error("...", { cause: err })`, log
  the error object itself, or use the area's errorMessage(err) helper.
# Same rule as no-stringified-error-ts; see its note.
files: ["**/*.tsx"]
rule:
  all:
    - any:
        - pattern: String($E)
        - pattern: $E.toString()
        - all:
            - pattern: $E as $T
            - not:
                pattern: $E as unknown
        - kind: template_substitution
          has:
            kind: identifier
            pattern: $E
        - kind: binary_expression
          all:
            - has:
                field: operator
                regex: '^\+$'
            - has:
                kind: identifier
                pattern: $E
            - has:
                any:
                  - kind: string
                  - kind: template_string
    - inside:
        stopBy: end
        any:
          - kind: catch_clause
            has:
              field: parameter
              pattern: $E
          # The callback passed to promise.catch().
          - pattern: '$P.catch(($E) => $B)'
          - pattern: '$P.catch(($E: $PT) => $B)'
          - pattern: '$P.catch($E => $B)'
          - pattern: '$P.catch(async ($E) => $B)'
          - pattern: '$P.catch(async ($E: $PT) => $B)'
          - pattern: '$P.catch(async $E => $B)'
          - pattern: '$P.catch(function ($E) { $$$ })'
          - pattern: '$P.catch(async function ($E) { $$$ })'
          - pattern: '$P.catch(function ($E: $PT) { $$$ })'
