id: no-swallowed-catch-ts
language: typescript
severity: error
message: >
  This catch hides the error: it is empty, or it only returns null, undefined,
  [], {}, false or nothing. Let the error propagate, or handle it: log it with
  context, or narrow to the error you expect (for example ENOENT) and rethrow
  the rest. If ignoring it really is correct, keep a comment of at least four
  words inside the catch that says why and which error is expected.
note: >
  A catch body is silent when, apart from comments, it is empty, a single
  `return` of nothing or of an empty value, or `void err`. A comment of four or
  more words in the body marks a deliberate ignore and is allowed.
# Every TypeScript file in the repo. .tsx files have their own -tsx rule.
files: ["**/*.ts", "**/*.mts", "**/*.cts"]
ignores:
  # Not fixed yet. The fix PRs stacked on this one remove these entries.
  - "scripts/service-qa/specs/billing-abuse.spec.ts"
  - "scripts/service-qa/specs/delete-account.spec.ts"
  - "scripts/service-qa/specs/desktop-token-exchange.spec.ts"
  - "scripts/service-qa/specs/gtm-metrics.spec.ts"
  - "scripts/service-qa/specs/mobile-control-plane.spec.ts"
  - "scripts/service-qa/specs/mobile-pkce-sign-in.spec.ts"
  - "supabase/functions/_shared/billing/stripe-api.ts"
  - "supabase/functions/_shared/remote/byos.ts"
  - "supabase/functions/_shared/remote/gateway-proxy.ts"
  - "supabase/functions/_shared/remote/instance-actions.ts"
  - "supabase/functions/_shared/remote/ssh-relay.ts"
  - "supabase/functions/billing-portal/index.ts"
  - "supabase/functions/exchange-desktop-token/index.ts"
  - "web/src/lib/billing.ts"
  - "web/src/lib/consent.ts"
  - "web/src/lib/pro-required.ts"
  - "web/src/lib/teams.ts"
  - "web/src/utils/searchDb.ts"
utils:
  # A block that is empty, or holds only `return;`, `return <empty value>;`
  # or `void err;`, with no explaining comment of four or more words.
  silent-block:
    kind: statement_block
    regex: '^\{\s*(?:(?://[^\n]*|/\*[\s\S]*?\*/)\s*)*(?:(?:return(?:\s+void\s+0|\s*\(?\s*(?:null|undefined|false|\[\s*\]|\{\s*\})\s*\)?)?|void\s+[\w$]+)\s*;?\s*(?:(?://[^\n]*|/\*[\s\S]*?\*/)\s*)*)?\}$'
    not:
      has:
        kind: comment
        regex: '\w+\W+\w+\W+\w+\W+\w+'
  silent-callback:
    any:
      - kind: arrow_function
        has:
          field: body
          any:
            - matches: silent-block
            - regex: '^\(?\s*(?:null|undefined|false|void\s+0|\[\s*\]|\{\s*\})\s*\)?$'
      - kind: function_expression
        has:
          field: body
          matches: silent-block
rule:
  any:
    - kind: catch_clause
      has:
        field: body
        matches: silent-block
    # promise.catch(() => {}) and friends.
    - pattern: $P.catch($CB)
constraints:
  CB:
    matches: silent-callback
