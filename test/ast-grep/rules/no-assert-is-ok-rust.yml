rule:
  kind: macro_invocation
  all:
    - has:
        field: macro
        regex: ^((std|core)::)?(debug_)?assert$
    # The first argument, after an optional `!`, ends in `.is_ok()` or
    # `.is_err()`: the identifier follows a `.`, its `()` is followed by the
    # end of the argument, and no top-level `,`, `&&`, `||`, `==` or `!=`
    # comes before it.
    - has:
        kind: token_tree
        has:
          kind: identifier
          regex: ^is_(ok|err)$
          follows:
            regex: ^\.$
          precedes:
            kind: token_tree
            regex: ^\(\s*\)$
            precedes:
              regex: ^[,)]$
          not:
            follows:
              stopBy: end
              regex: ^(,|&&|\|\||==|!=)$
