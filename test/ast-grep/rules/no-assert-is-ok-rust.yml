id: no-assert-is-ok-rust
language: rust
severity: error
message: >
  Do not assert on `.is_ok()` or `.is_err()`. When it fails, it prints only
  "assertion failed" and hides the error or value. In tests, call
  `.unwrap()`/`.expect("…")` or `.unwrap_err()`/`.expect_err("…")` (and
  assert on the error when it matters), or use
  `assert!(matches!(x, Err(Error::Variant(..))))` when the variant is the
  point. Outside tests, handle the Result instead of asserting on it.
files:
  - "src-tauri/**/*.rs"
  - "crates/**/*.rs"
rule:
  kind: macro_invocation
  all:
    - has:
        field: macro
        regex: ^((std|core)::)?(debug_)?assert$
    # The first argument, after an optional `!`, ends in `.is_ok()` or
    # `.is_err()`: the identifier follows a `.`, its `()` is followed by the
    # end of the argument, and no top-level `,`, `&&`, `||`, `==` or `!=`
    # comes before it.
    - has:
        kind: token_tree
        has:
          kind: identifier
          regex: ^is_(ok|err)$
          follows:
            regex: ^\.$
          precedes:
            kind: token_tree
            regex: ^\(\s*\)$
            precedes:
              regex: ^[,)]$
          not:
            follows:
              stopBy: end
              regex: ^(,|&&|\|\||==|!=)$
