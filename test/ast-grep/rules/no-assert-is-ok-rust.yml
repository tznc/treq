id: no-assert-is-ok-rust
language: rust
severity: error
message: >
  Do not assert on `.is_ok()` or `.is_err()`. When it fails, it prints only
  "assertion failed" and hides the error or value. In tests, call
  `.unwrap()`/`.expect("…")` or `.unwrap_err()`/`.expect_err("…")` (and
  assert on the error when it matters), or use
  `assert!(matches!(x, Err(Error::Variant(..))))` when the variant is the
  point. Outside tests, handle the Result instead of asserting on it.
files:
  - "src-tauri/**/*.rs"
  - "crates/**/*.rs"
