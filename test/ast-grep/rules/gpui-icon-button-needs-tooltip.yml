id: gpui-icon-button-needs-tooltip
language: rust
severity: error
message: >
  An icon-only button needs a tooltip: the icon alone does not say what it
  does. Give it `.tooltip(..)` with text that names the action, or use
  `ui::IconButton`, which shows its label.
note: >
  Checked: a `Button::new(..)` chain that takes `.icon(..)`, `.copy_icon(..)`
  or `.size(Size::Icon*)` and no `.label(..)`. It also passes with
  `.on_hover(..)` or inside a `Tooltips::wrap(..)`/`with_tooltip(..)`, or
  bound with `let` and handed to one later in the same block.
files:
  - "src-tauri/src/gpui_shell/**/*.rs"
  - "crates/treq-ui/src/**/*.rs"
ignores:
  - "src-tauri/src/gpui_shell/**/tests.rs"
  - "src-tauri/src/gpui_shell/**/tests/**"
  - "crates/treq-ui/src/**/*_tests.rs"
  # Builds the `Button` every `IconButton` is made of.
  - "crates/treq-ui/src/icon_button.rs"
utils:
  # A step of the builder chain the button is built in: a method call on
  # it, or a `.when(..)`/`.map(..)`-style closure that continues it.
  in-chain:
    any:
      - kind: field_expression
      - kind: call_expression
      - kind: closure_expression
      - kind: arguments
        inside:
          kind: call_expression
          has:
            field: function
            kind: field_expression
            has:
              field: field
              regex: ^(when|when_some|map)$
      - kind: block
        inside:
          kind: closure_expression
  icon-step:
    any:
      - kind: call_expression
        has:
          field: function
          kind: field_expression
          has:
            field: field
            regex: ^(icon|copy_icon)$
      - kind: call_expression
        all:
          - has:
              field: function
              kind: field_expression
              has:
                field: field
                regex: ^size$
          - has:
              field: arguments
              regex: Size::Icon
  label-step:
    kind: call_expression
    has:
      field: function
      kind: field_expression
      has:
        field: field
        regex: ^(label|child_label)$
  hover-step:
    kind: call_expression
    has:
      field: function
      kind: field_expression
      has:
        field: field
        regex: ^(on_hover|tooltip)$
  tooltip-call:
    kind: call_expression
    has:
      field: function
      any:
        - kind: field_expression
          has:
            field: field
            regex: ^(wrap|with_tooltip|tooltip)$
        - kind: identifier
          regex: ^(with_tooltip|tooltip)$
        - kind: scoped_identifier
          regex: (^|::)(with_tooltip|tooltip)$
  icon-button:
    all:
      - kind: call_expression
        has:
          field: function
          regex: (^|::)Button::new$
      - inside:
          stopBy:
            not:
              matches: in-chain
          matches: icon-step
      - not:
          inside:
            stopBy:
              not:
                matches: in-chain
            matches: label-step
rule:
  matches: icon-button
  not:
    any:
      - inside:
          stopBy:
            not:
              matches: in-chain
          matches: hover-step
      - inside:
          stopBy: end
          kind: arguments
          inside:
            matches: tooltip-call
      # `let button = ..;` then `wrap(.., button, cx)` later in the block.
      - inside:
          stopBy:
            not:
              matches: in-chain
          kind: let_declaration
          has:
            field: pattern
            pattern: $NAME
          precedes:
            stopBy: end
            has:
              stopBy: end
              kind: arguments
              inside:
                matches: tooltip-call
              has:
                stopBy: end
                kind: identifier
                pattern: $NAME
      - inside:
          kind: mod_item
          has:
            field: name
            regex: ^tests$
          stopBy: end
