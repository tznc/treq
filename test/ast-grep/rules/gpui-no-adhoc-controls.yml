id: gpui-no-adhoc-controls
language: rust
severity: error
message: >
  Do not build this control by hand. Use the `ui` primitive of the same
  name (`ui::Button`, `ui::Checkbox`, `ui::Tabs`, ..) so every screen
  shares one look and one behavior.
files:
  - "src-tauri/src/gpui_shell/**/*.rs"
ignores:
  - "src-tauri/src/gpui_shell/**/tests.rs"
  - "src-tauri/src/gpui_shell/**/tests/**"
rule:
  any:
    - kind: function_item
      has:
        field: name
        kind: identifier
        regex: ^(menu_item|checkbox|kbd|badge|icon_button|tabs|tab_trigger|tabs_list|empty_state|loading|spinner)$
    - kind: let_declaration
      all:
        - has:
            field: pattern
            kind: identifier
            regex: ^icon_button$
        - has:
            field: value
            kind: closure_expression
  not:
    inside:
      kind: mod_item
      has:
        field: name
        regex: ^tests$
      stopBy: end
