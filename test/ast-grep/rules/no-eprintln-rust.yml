id: no-eprintln-rust
language: rust
severity: error
message: >
  Do not use eprintln! outside of the CLI entry points. It bypasses tracing's
  EnvFilter and is not captured by the test harness, so it leaks into every
  test run and can't be filtered. Use tracing::warn!/tracing::debug! (or
  tracing::error! for real failures) instead. eprintln! stays allowed only in
  src-tauri/src/cli/** and lib.rs, where it prints CLI usage/error output
  directly to the user's terminal.
files:
  - "src-tauri/src/**/*.rs"
  - "src-tauri/tests/**/*.rs"
ignores:
  - "src-tauri/src/cli/**"
  - "src-tauri/src/lib.rs"
  # Debug-only startup timeline, opt-in with TREQ_STARTUP_TRACE=1; its
  # first marks come before tracing is set up.
  - "src-tauri/src/startup.rs"
  # Opt-in live suites (real Sprites API, real sshd): they print skip
  # notices and resource ids for whoever runs them with --nocapture.
  - "src-tauri/tests/remote_e2e.rs"
  - "src-tauri/tests/remote_e2e_native.rs"
  - "src-tauri/tests/remote_ssh_server_it.rs"
rule:
  pattern: eprintln!($$$)
