id: no-selector-click
language: rust
severity: error
message: >
  Do not click an element by its debug selector. Find it the way the user
  does with gpui-testing-library (`get_by_role`, `get_by_text`) and act with
  `screen.user().click(&node)`.
note: >
  `h.click(selector)` clicks the centre of the selector's painted bounds. It
  skips the role, name, visibility and enabled checks, and hits whatever is on
  top at that point.
# Baseline: files that already click by selector. Do not add to it;
# migrate a file and drop it from this list instead.
ignores:
  - "src-tauri/src/gpui_shell/overlay/tests.rs"
  - "src-tauri/src/gpui_shell/popover/tests.rs"
  - "src-tauri/src/gpui_shell/screen/tests.rs"
  - "src-tauri/src/gpui_shell/screen/tests/account_screen.rs"
  - "src-tauri/src/gpui_shell/screen/tests/allocs.rs"
  - "src-tauri/src/gpui_shell/screen/tests/changes_large.rs"
  - "src-tauri/src/gpui_shell/screen/tests/changes_screen.rs"
  - "src-tauri/src/gpui_shell/screen/tests/code_files_large.rs"
  - "src-tauri/src/gpui_shell/screen/tests/code_screen.rs"
  - "src-tauri/src/gpui_shell/screen/tests/commit_diffs.rs"
  - "src-tauri/src/gpui_shell/screen/tests/commits_large.rs"
  - "src-tauri/src/gpui_shell/screen/tests/commits_screen.rs"
  - "src-tauri/src/gpui_shell/screen/tests/dialogs.rs"
  - "src-tauri/src/gpui_shell/screen/tests/diff_extremes.rs"
  - "src-tauri/src/gpui_shell/screen/tests/file_browser.rs"
