id: gpui-debug-selector-needs-test-node
language: rust
severity: error
message: >
  An element with a `debug_selector` needs a gpui-testing-library node, or
  tests can only reach it by its painted bounds. Call `.test_support()` in
  the same builder chain, with a role and `.aria_label(..)` when it is a
  control, or build it from a `ui::` component that does.
note: >
  Checked: a `div()` chain that takes `.debug_selector(..)`. A chain that
  starts from a helper's result, or that sets a struct field (a component's
  `base`), is not checked, so the helper or the component's render calls
  `.test_support()` itself.
files:
  - "src-tauri/src/gpui_shell/**/*.rs"
  - "crates/treq-ui/**/*.rs"
ignores:
  - "src-tauri/src/gpui_shell/**/tests.rs"
  - "src-tauri/src/gpui_shell/**/tests/**"
  - "crates/treq-ui/**/*_tests.rs"
  # Baseline: files with selectors that have no test node. Do not add to it;
  # give each selector a node and drop the file from this list instead.
