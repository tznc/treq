utils:
  in-chain:
    any:
      - kind: field_expression
      - kind: call_expression
      - kind: closure_expression
      - kind: block
        inside:
          kind: closure_expression
      - kind: arguments
        inside:
          kind: call_expression
          has:
            field: function
            any:
              - kind: identifier
              - kind: scoped_identifier
              - kind: field_expression
                has:
                  field: field
                  regex: ^(when|when_some|when_none|map)$
  div-chain:
    inside:
      stopBy:
        not:
          matches: in-chain
      has:
        stopBy:
          not:
            matches: in-chain
        pattern: div()
rule:
  matches: div-chain
  kind: call_expression
  has:
    field: function
    kind: field_expression
    has:
      field: field
      regex: ^debug_selector$
  not:
    any:
      # A component's `base` field: checked where the component renders it.
      - inside:
          stopBy:
            not:
              matches: in-chain
          kind: field_initializer
      - inside:
          kind: mod_item
          has:
            field: name
            regex: ^tests$
          stopBy: end
