id: gpui-use-selector-helper
language: rust
severity: error
message: >
  Name an element for tests with `.selector("name")` from `treq_ui`, not a bare
  `.debug_selector(..)`. It sets the element id and debug selector to the same
  name and adds the gpui-testing-library node, so tests find the element by
  role, name or id instead of by its painted bounds.
note: >
  Checked: a `div()` chain that takes `.debug_selector(..)`. A chain that
  starts from a helper's result, or that sets a struct field (a component's
  `base`), is not checked: the helper or the component's render names it.
files:
  - "src-tauri/src/gpui_shell/**/*.rs"
  - "crates/treq-ui/**/*.rs"
ignores:
  - "src-tauri/src/gpui_shell/**/tests.rs"
  - "src-tauri/src/gpui_shell/**/tests/**"
  - "crates/treq-ui/**/*_tests.rs"
utils:
  in-chain:
    any:
      - kind: field_expression
      - kind: call_expression
      - kind: closure_expression
      - kind: block
        inside:
          kind: closure_expression
      - kind: arguments
        inside:
          kind: call_expression
          has:
            field: function
            any:
              - kind: identifier
              - kind: scoped_identifier
              - kind: field_expression
                has:
                  field: field
                  regex: ^(when|when_some|when_none|map)$
  div-chain:
    inside:
      stopBy:
        not:
          matches: in-chain
      has:
        stopBy:
          not:
            matches: in-chain
        pattern: div()
rule:
  matches: div-chain
  kind: call_expression
  has:
    field: function
    kind: field_expression
    has:
      field: field
      regex: ^debug_selector$
  not:
    any:
      # A component's `base` field: checked where the component renders it.
      - inside:
          stopBy:
            not:
              matches: in-chain
          kind: field_initializer
      - inside:
          kind: mod_item
          has:
            field: name
            regex: ^tests$
          stopBy: end
