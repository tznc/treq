id: gpui-use-selector-helper
language: rust
severity: error
message: >
  Name an element for tests with `.selector("name")` from `treq_ui`, not a bare
  `.debug_selector(..)`. It sets the element id and debug selector to the same
  name and adds the gpui-testing-library node, so tests find the element by
  role, name or id instead of by its painted bounds.
note: >
  Checked: a `div()` chain that takes `.debug_selector(..)`. A chain that
  starts from a helper's result, or that sets a struct field (a component's
  `base`), is not checked: the helper or the component's render names it.
files:
  - "src-tauri/src/gpui_shell/**/*.rs"
  - "crates/treq-ui/**/*.rs"
ignores:
  - "src-tauri/src/gpui_shell/**/tests.rs"
  - "src-tauri/src/gpui_shell/**/tests/**"
  - "crates/treq-ui/**/*_tests.rs"
  # Baseline: files with bare debug selectors. Do not add to it;
  # name each element with `.selector(..)` and drop the file from this list.
  - "crates/treq-ui/src/alert.rs"
