rule:
  any:
    - pattern: $H.click($$$ARGS)
    - pattern: $H.right_click($$$ARGS)
    - pattern: $H.hover($$$ARGS)
    - pattern: type_into($H, $$$ARGS)
    - pattern: double_click($H, $$$ARGS)
    - pattern: hover($H, $$$ARGS)
    - pattern: right_click($H, $$$ARGS)
constraints:
  H:
    regex: ^(&mut )?(self\.)?h$
