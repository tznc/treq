id: no-selector-interaction
language: rust
severity: error
message: >
  Do not act on an element by its debug selector. Find it the way the user
  does with gpui-testing-library (`get_by_role`, `get_by_text`) and act with
  `screen.user()` (`click`, `right_click`, `dbl_click`, `hover`, `type_text`).
note: >
  Selector helpers act at the centre of the selector's painted bounds, so they
  never check the element's role or accessible name, act on elements that are
  painted but hidden, and silently pick one of two elements sharing a selector.
  Role queries skip hidden elements and fail on ambiguous matches.
files:
  - "src-tauri/src/gpui_shell/**/*.rs"
  - "crates/treq-ui/**/*.rs"
# Baseline: files that already act by selector. Do not add to it;
# migrate a file and drop it from this list instead.
ignores:
  - "src-tauri/src/gpui_shell/overlay/tests.rs"
  - "src-tauri/src/gpui_shell/popover/tests.rs"
  - "src-tauri/src/gpui_shell/screen/tests.rs"
