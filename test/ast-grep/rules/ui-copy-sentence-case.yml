id: ui-copy-sentence-case
language: rust
severity: error
message: >
  Write UI labels in sentence case: "Merge preview", "Add comment", "Open
  repository…", "UI zoom", "API key". Capitalize only the first word and
  proper nouns (GitHub, Linear, Claude Code, Treq Cloud). Sidebar group
  labels, drawn in capitals, are exempt.
files:
  - "src-tauri/src/gpui_shell/**/*.rs"
ignores:
  - "src-tauri/src/gpui_shell/**/tests.rs"
  - "src-tauri/src/gpui_shell/**/tests/**"
rule:
  kind: string_literal
  not:
    inside:
      kind: mod_item
      has:
        field: name
        regex: ^tests$
      stopBy: end
  any:
    # Any string of two or more words, every one capitalized:
    # "Merge Commit Message".
    - all:
        - regex: ^"[A-Z][a-z]+( (a|an|the|in|of|on|to|for|with|from|and|or|[A-Z][a-z]+))* [A-Z][a-z]+(…|\.\.\.)?"$
        - not:
            any:
              # Proper nouns keep their capitals.
              - regex: \b(GitHub|Github|Linear|Claude|Treq|Cursor|Codex|Opus|Sonnet|Haiku|Jujutsu|Docker|Git|Zed|Pro)\b
              # Sidebar group labels, drawn in capitals.
              - inside:
                  kind: function_item
                  has:
                    field: name
                    regex: ^section$
                  stopBy: end
              - inside:
                  kind: const_item
                  has:
                    field: name
                    regex: _GROUPS$
                  stopBy: end
    # A form field's label or a section heading where a later word is
    # capitalized and isn't a product name or acronym: "UI Zoom",
    # "API Key", "Claude Code Model", "Included Files/Directories".
    - all:
        - regex: ^"\S+ .*[A-Z]
        - not:
            # Allowed: the first word (or a product name), then only
            # lowercase words, product names and acronyms.
            regex: ^"(Claude Code|Treq Cloud|GitHub CLI|\S+)( ([a-z0-9(…'"-]\S*|GitHub|Linear|Claude Code|Claude|Treq Cloud|Treq|Codex|Cursor|Copilot|Jujutsu|Git|OAuth|[A-Z0-9]{2,}[.,:]?))*"$
        # The label argument: the first, or a select's second (its name).
        - any:
            - all:
                - nthChild: 1
                - inside:
                    kind: arguments
                    inside:
                      kind: call_expression
                      has:
                        field: function
                        regex: (^|::)(label|field_block|saved_field_block|setting_row|switch_row|heading)$
            - all:
                - nthChild: 2
                - inside:
                    kind: arguments
                    inside:
                      kind: call_expression
                      has:
                        field: function
                        regex: (^|::)(section_header|select_field)$
