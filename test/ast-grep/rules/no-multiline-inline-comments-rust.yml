id: no-multiline-inline-comments-rust
language: rust
severity: warning
message: >
  Keep inline comments inside code blocks to a single line. Use one concise comment
  line or move longer context to docs.
files:
  - "src-tauri/src/**/*.rs"
rule:
  kind: source_file
  # Disallow:
  # 1) consecutive indented // lines (/// and //! doc comments are allowed)
  # 2) indented /* comments that do not close on the same line
  regex: (?m)^[ \t]{2,}//(?:[^/!\n][^\n]*)?\n[ \t]{2,}//(?:[^/!\n]|$)|^[ \t]{2,}/\*(?:[^*!\n](?:[^*\n]|\*[^/\n])*)?$
