id: no-ok-discard-rust
language: rust
severity: error
message: >
  `.ok();` throws the error away without a trace. Propagate it with `?` when
  the function returns a compatible Result. Otherwise log it with context
  (`log::`/`tracing::`, at a level that fits the consequence; `debug` for
  best-effort cleanup), or match on `Err(e)` and say why ignoring it is
  correct. In tests, use `.unwrap()` or `.expect(..)`. `let _ = x.ok();`,
  `drop(x.ok())` and `x.ok().is_some();` hide the same error.
note: >
  Matches `.ok()` used as a statement, and the same value thrown away by
  `drop(..)`, `.is_some()`/`.is_none()` or a `_`-prefixed binding. Code inside
  macro bodies (`vec![..]`) is not parsed, so it is not checked.
files:
  - "src-tauri/**/*.rs"
  - "crates/**/*.rs"
utils:
  ok-call:
    kind: call_expression
    pattern: $X.ok()
rule:
  any:
    - kind: expression_statement
      has:
        any:
          - matches: ok-call
          - pattern: $X.ok().is_some()
          - pattern: $X.ok().is_none()
          - pattern: drop($X.ok())
    - kind: let_declaration
      all:
        - has:
            field: pattern
            regex: ^_
        - has:
            field: value
            matches: ok-call
