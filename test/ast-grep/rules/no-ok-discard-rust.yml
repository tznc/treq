utils:
  ok-call:
    kind: call_expression
    pattern: $X.ok()
rule:
  any:
    - kind: expression_statement
      has:
        any:
          - matches: ok-call
          - pattern: $X.ok().is_some()
          - pattern: $X.ok().is_none()
          - pattern: drop($X.ok())
    - kind: let_declaration
      all:
        - has:
            field: pattern
            regex: ^_
        - has:
            field: value
            matches: ok-call
