id: max-500-non-comment-lines-tauri
language: rust
severity: warning
message: >
  Keep Rust files in src-tauri/src/ at 500 non-comment lines or fewer. Split large
  files into smaller modules.
files:
  - "src-tauri/src/**/*.rs"
ignores:
  - "src-tauri/src/core/workspaces.rs"
  - "src-tauri/src/commands/workspace.rs"
  - "src-tauri/src/local_db.rs"
  - "src-tauri/src/jj.rs"
rule:
  kind: source_file
  # Triggers when a file has 501+ lines that are neither blank nor comment-only.
  regex: (?ms)(?:.*^\s*(?:[^/\s].*|/[^/*].*|/\*[^*].*|\*[^/].*)$\n?){501,}
