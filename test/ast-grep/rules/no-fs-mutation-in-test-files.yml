id: no-fs-mutation-in-test-files
language: rust
severity: warning
message: >
  Do not use direct filesystem mutation in a *_test.rs file. Use e2e test helpers and helpers on `TestRepo`  to avoid direct filesystem mutation.
  See @src-tauri/tests/common/mod.rs for more details.
files:
  - "src-tauri/**/*_test.rs"
ignores:
  # - "**/*_tests.rs"
  - "**/tests/common/mod.rs"
rule:
  any:
    - pattern: fs::write($$$)
    - pattern: std::fs::write($$$)
    - pattern: fs::create_dir($$$)
    - pattern: std::fs::create_dir($$$)
    - pattern: fs::create_dir_all($$$)
    - pattern: std::fs::create_dir_all($$$)
    - pattern: fs::rename($$$)
    - pattern: std::fs::rename($$$)
    - pattern: fs::copy($$$)
    - pattern: std::fs::copy($$$)
    - pattern: fs::hard_link($$$)
    - pattern: std::fs::hard_link($$$)
    - pattern: fs::soft_link($$$)
    - pattern: std::fs::soft_link($$$)
    - pattern: fs::set_permissions($$$)
    - pattern: std::fs::set_permissions($$$)
    - pattern: File::create($$$)
    - pattern: std::fs::File::create($$$)
    - pattern: File::create_new($$$)
    - pattern: std::fs::File::create_new($$$)
    - pattern: $RECV.open($$$)
    - pattern: $RECV.write($$$)
    - pattern: $RECV.write_all($$$)
    - pattern: $RECV.write_fmt($$$)
