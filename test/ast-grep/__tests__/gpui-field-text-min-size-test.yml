id: gpui-field-text-min-size
valid:
  - |
    pub fn field_label(text: impl Into<SharedString>) -> Div {
      ui::text(div(), TextSize::Sm).child(text.into())
    }
  - |
    fn field_hint(text: &'static str, p: &Palette) -> Div {
      ui::text(div(), TextSize::Sm).text_color(p.muted_foreground).child(text)
    }
  - |
    fn badge(p: &Palette) -> Div {
      ui::text(div(), TextSize::Xs).child("3")
    }
  - |
    fn render() -> Div {
      div().child(field_label("Workspaces"))
    }
  - |
    fn day_label(label: &str, p: &Palette) -> impl IntoElement {
      ui::text(div(), TextSize::Xs).child(label.to_string())
    }
invalid:
  - |
    pub fn label_xs(text: impl Into<SharedString>) -> Div {
      ui::text(div(), TextSize::Sm).child(text.into())
    }
  - |
    fn render() -> Div {
      div().child(label_xs("Workspaces"))
    }
  - |
    pub fn field_label(text: impl Into<SharedString>) -> Div {
      ui::text(div(), TextSize::Xs).child(text.into())
    }
  - |
    fn input_hint(p: &Palette) -> Div {
      ui::text(div(), TextSize::Xs).text_color(p.muted_foreground)
    }
