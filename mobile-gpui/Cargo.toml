[package]
name = "treq-gpui"
version = "0.1.0"
description = "Experimental Treq mobile app with a GPUI interface"
edition = "2021"
publish = false

# A separate workspace: this app needs tauri >= 2.12 (tauri-plugin-gpui) and
# must not move the desktop app's lockfile.
[workspace]

[lib]
# `cdylib` is what Android loads; `rlib` keeps `cargo run` working on desktop.
name = "treq_gpui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
treq = { path = "../src-tauri", features = ["embed", "mobile-ui"] }
tauri = { version = "2.12", features = ["unstable"] }
# `tauri::generate_context!` expands to code that uses these.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Direct dependencies so this app's build script registers their native
# Android/iOS code; the Rust side is used from `treq_lib::mobile`.
tauri-plugin-gpui = { git = "https://github.com/ziinc/tauri-gpui", branch = "main", features = ["mobile"] }
tauri-plugin-deep-link = "2.4.7"
tauri-plugin-opener = "2.5.2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-keystore = "2.1.0-alpha.1"
tauri-plugin-biometric = "2"

# gpui-kit fork with a native touch selection opt-out and
# `set_selected_text_range`, so tauri-plugin-gpui's native Android toolbar and
# drag handles replace gpui-kit's own. Drop once upstream has both.
[patch.crates-io]
gpui-kit = { git = "https://github.com/Ziinc/gpui-kit", branch = "main" }
gpui-component = { git = "https://github.com/Ziinc/gpui-kit", branch = "main" }
gpui-base = { git = "https://github.com/Ziinc/gpui-kit", branch = "main" }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
debug = false

# wgpu turns on shader debug info in debug builds, and the Android emulator's
# SwiftShader Vulkan rejects the SPIR-V that produces. Build wgpu-types as in
# release so its default instance flags leave that off.
[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

[package.metadata.cargo-machete]
# The app's code is `treq_lib::mobile`; this crate depends on the plugins
# only so its build script registers their native code, and on serde for
# `generate_context!`.
ignored = [
  "serde",
  "tauri-plugin-biometric",
  "tauri-plugin-deep-link",
  "tauri-plugin-gpui",
  "tauri-plugin-keystore",
  "tauri-plugin-opener",
]
