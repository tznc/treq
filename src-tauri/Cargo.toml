[package]
name = "treq"
version = "0.3.0"
description = "Stacking Agent Development Environment"
authors = ["Ziinc"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "treq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
tauri-test = ["dep:tauri-test", "dep:napi", "dep:napi-derive", "dep:tempfile"]
# Linked into another Tauri app as a library (mobile-gpui): leaves out the
# mobile entry point, whose JNI symbols would clash with the host app's.
embed = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
napi-build = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Desktop-only crates. `tauri-plugin-cli` has no Android/iOS support, and the
# `treq` command-line entry point it backs only exists on desktop, so mobile
# builds leave it out entirely (see `#[cfg(desktop)]` on `mod cli` in lib.rs).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-cli = "2.4.1"
# Parses CLI args before Tauri starts (see `cli::args`); same version the plugin uses.
clap = "4"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# In-app updates from signed GitHub release artifacts (see `latest.json`).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dependencies]
tauri = { version = "2.10.3", features = ["protocol-asset", "unstable"] }
tauri-test = { version = "0.2.1", optional = true }
napi = { version = "2", default-features = false, features = ["napi8", "async", "serde-json"], optional = true }
napi-derive = { version = "2", optional = true }
tauri-plugin-opener = "2.5.2"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-log = "2.8.0"
tauri-plugin-deep-link = "2.4.7"
# OS notifications when an agent finishes. 2.5 requires tauri 2.12.
tauri-plugin-notification = "~2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.39", features = ["bundled"] }
portable-pty = "0.9"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
ignore = "0.4"
jj-lib = "0.40.0"
futures = "0.3"
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-full = "0.7"
log = "0.4"
regex = "1"
rayon = "1.10"
urlencoding = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
imara-diff = "0.1.8"
gix = { version = "0.81.0", features = ["blocking-http-transport-reqwest-rust-tls"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["registry", "env-filter"] }

tempfile = { version = "3", optional = true }
async-trait = "0.1.92"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "io-util", "net", "sync"] }
russh = "0.63.1"
# WebSocket transport for managed SSH through the `remote-ssh-relay` Edge
# Function. TLS uses the same rustls + ring stack reqwest already pulls in.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
bytes = "1"
getrandom = "0.4"
tauri-plugin-keystore = "2.1.0-alpha.1"
tauri-plugin-biometric = "2"

[dev-dependencies]
mockall = "0.14.0"
tempfile = "3"
criterion = { version = "0.8.2", features = ["html_reports"] }
getrandom = "0.4"
rand_core = "0.10"
wiremock = "0.6"

[[bench]]
name = "commit_workspace"
harness = false

[[bench]]
name = "create_workspace"
harness = false

[[bench]]
name = "auto_rebase"
harness = false

[[bench]]
name = "workspace_status"
harness = false

[[bench]]
name = "delete_workspace"
harness = false

[[bench]]
name = "list_workspace_statuses"
harness = false

[[bench]]
name = "workspace_diff"
harness = false

[[bench]]
name = "sync_workspaces"
harness = false

[[bench]]
name = "merge_workspace"
harness = false
