[package]
name = "treq"
version = "0.3.0"
description = "Stacking Agent Development Environment"
authors = ["Ziinc"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "treq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["gui", "gpui-shell"]
# The desktop app. Without it the crate builds only the `treq` CLI, with no
# Tauri, GTK or WebKit, for Linux hosts and containers without a display.
gui = [
  "dep:tauri",
  "dep:tauri-build",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-log",
  "dep:tauri-plugin-deep-link",
  "dep:tauri-plugin-notification",
  "dep:tauri-plugin-keystore",
  "dep:keyring",
  "dep:tauri-plugin-biometric",
  "dep:tauri-plugin-cli",
  "dep:tauri-plugin-single-instance",
]
# Desktop repo windows open in a GPUI shell, which draws the workspace sidebar.
gpui-shell = ["gui", "dep:tauri-plugin-gpui", "dep:gpui-kit", "dep:treq-ui", "dep:syntect", "dep:two-face", "dep:alacritty_terminal", "dep:image", "dep:emojis"]
# Linked into another Tauri app as a library (mobile-gpui): leaves out the
# mobile entry point, whose JNI symbols would clash with the host app's.
embed = []
# Embeds a Playwright server (gpui-playwright) in the GPUI app so the
# e2e/desktop suite can drive it. It only listens when `GPUI_PLAYWRIGHT` is
# set, and release builds leave the feature out.
e2e = ["gpui-shell", "dep:gpui-playwright"]

# Clippy's default set runs in CI with -D warnings; these add checks it
# leaves out. clippy.toml lets tests unwrap and expect.
[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
string_slice = "warn"
# Output goes through tracing; only the CLI prints (allowed in cli/).
print_stdout = "warn"
print_stderr = "warn"
mem_forget = "warn"
exit = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
redundant_clone = "warn"
manual_let_else = "warn"
needless_collect = "warn"
implicit_clone = "warn"

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Asks GDK whether a compositor draws transparent GPUI popups (gpui_shell::popup).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Desktop-only crates. `tauri-plugin-cli` has no Android/iOS support, and the
# `treq` command-line entry point it backs only exists on desktop, so mobile
# builds leave it out entirely (see `#[cfg(desktop)]` on `mod cli` in lib.rs).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-cli = { version = "2.4.1", optional = true }
# Parses CLI args before Tauri starts (see `cli::args`); same version the plugin uses.
clap = { version = "4", features = ["string"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"], optional = true }
# GPUI renderer for Tauri windows. Same source as mobile-gpui's, so both
# resolve to one copy of GPUI when mobile-gpui links this crate.
tauri-plugin-gpui = { git = "https://github.com/ziinc/tauri-gpui", branch = "main", optional = true }
# Widgets for the GPUI screens: text inputs, lists, tables, menus, markdown,
# diffs and code views. The
# fork mobile-gpui uses, on the same GPUI as tauri-plugin-gpui.
gpui-kit = { git = "https://github.com/Ziinc/gpui-kit", branch = "main", default-features = false, features = ["component"], optional = true }
# The design system: theme tokens and the `ui` components (crates/treq-ui).
treq-ui = { path = "../crates/treq-ui", optional = true }
# Playwright protocol server inside the GPUI app (the `e2e` feature). It
# reads the elements gpui-kit observes; `painted-text` adds their text. The
# branch adds `Server::on_adopt_page` (not in 0.1.0 yet).
gpui-playwright = { git = "https://github.com/Ziinc/gpui-playwright", branch = "claude/project-thread-yruhjk", features = ["painted-text"], optional = true }
# Syntax highlighting for GPUI diffs, the same syntect set gpui-kit uses.
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"], optional = true }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"], optional = true }
# Terminal emulation for the GPUI terminal pane: parses PTY output into a grid.
alacritty_terminal = { version = "0.26", default-features = false, optional = true }
# Draws review highlights onto `treq send` images (gpui_shell terminal pane).
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
# The Supabase session lives in the OS keychain (core::session_secrets).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"], optional = true }

[dependencies]
tauri = { version = "2.12", features = ["unstable"], optional = true }
tauri-plugin-opener = { version = "2.5.2", optional = true }
tauri-plugin-dialog = { version = "2.7.0", optional = true }
tauri-plugin-log = { version = "2.8.0", optional = true }
tauri-plugin-deep-link = { version = "2.4.7", optional = true }
# OS notifications when an agent finishes. 2.5 requires tauri 2.12.
tauri-plugin-notification = { version = "~2.4", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.39", features = ["bundled"] }
portable-pty = "0.9"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
ignore = "0.4"
jj-lib = "0.40.0"
futures = "0.3"
# Watches the selected workspace so the Changes tab follows edits on disk.
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-full = "0.7"
log = "0.4"
regex = "1"
emojis = { version = "0.9", optional = true }
urlencoding = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
imara-diff = "0.1.8"
gix = { version = "0.81.0", features = ["blocking-http-transport-reqwest-rust-tls"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["registry", "env-filter"] }

async-trait = "0.1.92"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "io-util", "net", "sync"] }
russh = "0.63.1"
# WebSocket transport for managed SSH through the `remote-ssh-relay` Edge
# Function. TLS uses the same rustls + ring stack reqwest already pulls in.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
bytes = "1"
getrandom = "0.4"
tauri-plugin-keystore = { version = "2.1.0-alpha.1", optional = true }
tauri-plugin-biometric = { version = "2", optional = true }

[dev-dependencies]
mockall = "0.14.0"
tempfile = "3"
criterion = { version = "0.8.2", features = ["html_reports"] }
getrandom = "0.4"
rand_core = "0.10"
wiremock = "0.6"

# Headless GPUI tests for the GPUI shell. The same gpui-pre that
# tauri-plugin-gpui renders with, plus its test platform.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
# Testing Library queries, user events and matchers for the GPUI screens. Its
# `gpui-kit` feature reads what `.test_support()` observes.
gpui-testing-library = { version = "=0.1.0", features = ["gpui-kit"] }

[[bench]]
name = "commit_workspace"
harness = false

[[bench]]
name = "create_workspace"
harness = false

[[bench]]
name = "auto_rebase"
harness = false

[[bench]]
name = "workspace_status"
harness = false

[[bench]]
name = "delete_workspace"
harness = false

[[bench]]
name = "list_workspace_statuses"
harness = false

[[bench]]
name = "workspace_diff"
harness = false

[[bench]]
name = "commits_log"
harness = false

[[bench]]
name = "sync_workspaces"
harness = false

[[bench]]
name = "merge_workspace"
