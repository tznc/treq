# cargo-fuzz targets for treq's text parsers. Nightly only, Linux/macOS:
#   cargo +nightly fuzz run unified_patch -- -max_total_time=30
# Not part of `cargo test`. The parsers are compiled from their source files
# directly, so fuzzing does not build the whole app.
[package]
name = "treq-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["string"] }

# Its own workspace, so the repository's workspace does not pick it up.
[workspace]
members = ["."]

[[bin]]
name = "unified_patch"
path = "fuzz_targets/unified_patch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "conflict_markers"
path = "fuzz_targets/conflict_markers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cli_args"
path = "fuzz_targets/cli_args.rs"
test = false
doc = false
bench = false

# serde is used by the parser sources pulled in with #[path].
[package.metadata.cargo-machete]
ignored = ["serde"]
