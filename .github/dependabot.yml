version: 2
updates:
  # Actions are pinned to commit SHAs with the version in a trailing comment.
  # Dependabot bumps both together in one grouped PR a week.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    # Let a new release age a week before adopting it, so a compromised
    # release has time to be caught and pulled first.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
