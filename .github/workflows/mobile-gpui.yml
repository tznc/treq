name: Mobile GPUI

# The Treq mobile app, built with GPUI: src-tauri with the `mobile-ui`
# feature (src-tauri/src/mobile).
# Produces an installable Android debug APK (signed with the debug key) as
# the `treq-gpui-debug-apk` artifact, then smoke-tests it on an emulator.

defaults:
  run:
    shell: bash

on:
  # Push is main-only: without the branch filter every feature-branch push
  # that touched src-tauri/** ran the ~30 runner-minute Android build, which
  # saturated the runner pool and queued every other PR's checks.
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "scripts/mobile/**"
      - "crates/**"
      - "package.json"
      - ".github/workflows/mobile-gpui.yml"
  pull_request:
    paths:
      - "src-tauri/src/mobile/**"
      - "src-tauri/tauri.android.conf.json"
      - "src-tauri/tauri.ios.conf.json"
      - "scripts/mobile/**"
      - ".github/workflows/mobile-gpui.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  NDK_VERSION: 27.0.12077973

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    # A cold build of treq with `mobile-ui` takes over 15 minutes; the main
    # push run saves the cache PRs restore, after which they finish well
    # inside this.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      # The app's code is treq's `mobile` module (the `mobile-ui` feature),
      # so its tests run in the root workspace.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          key: mobile-host
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libwayland-dev libx11-xcb-dev \
            libfontconfig-dev libfreetype-dev libgbm-dev libegl-dev libxdo-dev
      - name: cargo test
        run: cargo test --locked -p treq --lib --features mobile-ui "mobile::"

  # The APK build and emulator smoke run on manual dispatch only; nightly.yml
  # builds the mobile apps every day. Push and PR runs keep the unit tests.
  android-apk:
    name: Android debug APK
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          key: android
          cache-on-failure: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Install NDK
        run: |
          sdkmanager --install "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # The generated Gradle project calls back into the Tauri CLI, so it is
      # a local npm install.
      - name: Build debug APK (arm64 + x86_64)
        run: |
          npm ci --no-audit --no-fund
          npm run tauri -- android init --ci
          scripts/mobile/apply-icons.sh
          # `android init` regenerates gen/android without the plugin entries;
          # only this app's build script adds them back (tauri-plugin-gpui's
          # GpuiView), and a warm Rust cache skips it. Force it to rerun.
          for target in aarch64-linux-android x86_64-linux-android; do
            cargo clean -p treq --target "$target"
          done
          npm run tauri -- android build --features mobile-ui --debug --apk --target aarch64 --target x86_64 --ci
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*universal-debug.apk' | head -1)
          ls -la "$apk"
          cp "$apk" "$RUNNER_TEMP/treq-gpui-debug.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: treq-gpui-debug-apk
          path: ${{ runner.temp }}/treq-gpui-debug.apk
          retention-days: 30
          if-no-files-found: error

  emulator-smoke:
    name: Emulator smoke test
    needs: android-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: treq-gpui-debug-apk
          path: ${{ runner.temp }}/apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: scripts/mobile/android-smoke.sh ${{ runner.temp }}/apk/treq-gpui-debug.apk target/android-smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: treq-gpui-emulator-screenshots
          path: target/android-smoke
