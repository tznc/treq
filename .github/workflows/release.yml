name: Release

defaults:
  run:
    shell: bash

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete pre-existing draft release for this version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          TAG="v${VERSION}"

          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" \
            --jq ".[] | select(.tag_name == \"${TAG}\" and .draft == true) | .id")

          if [ -n "$RELEASE_ID" ]; then
            echo "Deleting existing draft release for ${TAG}"
            gh api -X DELETE "repos/${{ github.repository }}/releases/${RELEASE_ID}"
          fi

          if gh api "repos/${{ github.repository }}/git/refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "Deleting existing tag ${TAG}"
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/${TAG}"
          fi

  release:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
            app_bundle: "target/aarch64-apple-darwin/release/bundle/macos/Treq.app"
          - platform: "macos-latest" # for Intel based macs.
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
            app_bundle: "target/x86_64-apple-darwin/release/bundle/macos/Treq.app"
          # - platform: "macos-latest"
          #   target: "universal-apple-darwin"
          #   args: "--target universal-apple-darwin"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            args: "--target x86_64-unknown-linux-gnu"
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: "--target x86_64-pc-windows-msvc"
    runs-on: ${{ matrix.platform }}
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install dependencies (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: ". -> target"

      # Certificate import handled by tauri-action with auto-detect
      # Manual certificate import commented out - tauri-action handles this automatically
      # Uncomment this section if auto-detect fails
      # - name: import Apple Developer Certificate
      #   # Prevents keychain from locking automatically for 3600 seconds.
      #   env:
      #     APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      #     APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #     KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      #   run: |
      #     echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
      #     security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
      #     security default-keychain -s build.keychain
      #     security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
      #     security set-keychain-settings -t 3600 -u build.keychain
      #     security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
      #     security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
      #     security find-identity -v -p codesigning build.keychain

      # - name: verify certificate
      #   run: |
      #     CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
      #     CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
      #     echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV
      #     echo "Certificate imported: $CERT_ID"

      - name: Install dependencies
        run: npm ci

      # Desktop only links the `treq` binary. The staticlib and cdylib crate
      # types exist for iOS/Android and the NAPI test addon, and with LTO each
      # one is a separate whole-program link, roughly tripling link time.
      - name: Build only the rlib for desktop
        run: |
          sed -i.bak 's/^crate-type = .*/crate-type = ["rlib"]/' src-tauri/Cargo.toml
          grep -qx 'crate-type = \["rlib"\]' src-tauri/Cargo.toml
          rm src-tauri/Cargo.toml.bak

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Signs the updater artifacts that tauri-plugin-updater verifies
          # against `plugins.updater.pubkey` in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Compiled into the app as the updater's verification key.
          TAURI_SIGNER_PUBLIC_KEY: ${{ vars.TAURI_SIGNER_PUBLIC_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: "v__VERSION__"
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          releaseAssetNamePattern: "[name]-[version]-[platform]-[arch][ext]"
          # Uploads latest.json; the web build republishes it as treq.dev/version.json.
          includeUpdaterJson: true
          # Updater artifacts need the signing key, so only release builds make them.
          args: ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Verify packaged macOS bundle
        if: runner.os == 'macOS'
        run: bash scripts/verify-macos-bundle.sh "${{ matrix.app_bundle }}"
