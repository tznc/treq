name: Release

defaults:
  run:
    shell: bash

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Delete pre-existing draft release for this version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          TAG="v${VERSION}"

          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" \
            --jq ".[] | select(.tag_name == \"${TAG}\" and .draft == true) | .id")

          if [ -n "$RELEASE_ID" ]; then
            echo "Deleting existing draft release for ${TAG}"
            gh api -X DELETE "repos/${{ github.repository }}/releases/${RELEASE_ID}"
          fi

          if gh api "repos/${{ github.repository }}/git/refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "Deleting existing tag ${TAG}"
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/${TAG}"
          fi

  release:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
            app_bundle: "target/aarch64-apple-darwin/release/bundle/macos/Treq.app"
          - platform: "macos-latest" # for Intel based macs.
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
            app_bundle: "target/x86_64-apple-darwin/release/bundle/macos/Treq.app"
          # - platform: "macos-latest"
          #   target: "universal-apple-darwin"
          #   args: "--target universal-apple-darwin"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            args: "--target x86_64-unknown-linux-gnu"
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: "--target x86_64-pc-windows-msvc"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 20
    environment: prod
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: "npm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: install dependencies (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libwayland-dev libx11-xcb-dev \
            libfontconfig-dev libfreetype-dev libgbm-dev libegl-dev libxdo-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          workspaces: ". -> target"

      - name: Install dependencies
        run: npm ci

      # Desktop only links the `treq` binary. The staticlib and cdylib crate
      # types exist for iOS/Android, and with LTO each
      # one is a separate whole-program link, roughly tripling link time.
      - name: Build only the rlib for desktop
        run: |
          sed -i.bak 's/^crate-type = .*/crate-type = ["rlib"]/' src-tauri/Cargo.toml
          grep -qx 'crate-type = \["rlib"\]' src-tauri/Cargo.toml
          rm src-tauri/Cargo.toml.bak

      # tauri-action finds the app by globbing for tauri.conf.json and takes
      # the first match, which is mobile-gpui/ (sorted before src-tauri/).
      # It then looks for the desktop bundles under mobile-gpui/target.
      - name: Hide the mobile-gpui Tauri config from tauri-action
        run: rm mobile-gpui/tauri.conf.json

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Signs the updater artifacts that tauri-plugin-updater verifies.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Compiled into the app as the updater's verification key.
          TAURI_SIGNER_PUBLIC_KEY: ${{ vars.TAURI_SIGNER_PUBLIC_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: "v__VERSION__"
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          releaseAssetNamePattern: "[name]-[version]-[platform]-[arch][ext]"
          # Uploads latest.json; the web build republishes it as treq.dev/version.json.
          includeUpdaterJson: true
          # Updater artifacts need the signing key, so only release builds make them.
          args: ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Verify packaged macOS bundle
        if: runner.os == 'macOS'
        run: bash scripts/verify-macos-bundle.sh "${{ matrix.app_bundle }}"

  # Headless `treq` CLI for Linux hosts without a desktop (devcontainers,
  # remote VMs). Built without the `gui` feature and linked statically
  # against musl, so it runs on any distro, Alpine included.
  linux-cli:
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-musl"
            arch: "x86_64"
          - platform: "ubuntu-22.04-arm"
            target: "aarch64-unknown-linux-musl"
            arch: "aarch64"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 20
    environment: prod
    steps:
      - uses: actions/checkout@v5

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: install musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          workspaces: ". -> target"
          key: ${{ matrix.target }}

      - name: Build only the rlib for the CLI
        run: |
          sed -i 's/^crate-type = .*/crate-type = ["rlib"]/' src-tauri/Cargo.toml
          grep -qx 'crate-type = \["rlib"\]' src-tauri/Cargo.toml

      - name: Build headless CLI
        run: cargo build --release --locked --no-default-features --bin treq --target ${{ matrix.target }}

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BIN="target/${{ matrix.target }}/release/treq"
          "$BIN" --help | grep -F "Usage: treq"
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          ASSET="treq-cli-${VERSION}-linux-${{ matrix.arch }}.tar.gz"
          tar -czf "$ASSET" -C "$(dirname "$BIN")" treq
          # Devcontainers verify the archive against this before installing it.
          sha256sum "$ASSET" > "$ASSET.sha256"
          gh release upload "v${VERSION}" "$ASSET" "$ASSET.sha256" --clobber
