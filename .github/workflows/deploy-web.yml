name: Deploy Web

on:
  workflow_dispatch:
  # Only Docusaurus site changes.
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "e2e/desktop/landing/**"
      - ".github/workflows/deploy-web.yml"
  # Rebuild so /version and the download links pick up the new release.
  release:
    types: [published]
  # Nightly production rebuild, an hour after the nightly build.
  schedule:
    - cron: "0 10 * * *"
  pull_request:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
      - ".github/scripts/check_readability.py"
      - "biome.json"

# Production deploys queue behind each other. PR previews get a group per PR,
# so one PR's preview no longer cancels another's pending run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-web-pr-{0}', github.event.pull_request.number) || 'deploy-web' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  # Captures the landing screenshots from the real app (e2e/desktop/landing,
  # gpui-playwright). Production builds only: PR previews reuse main's latest
  # artifact (see the build job), which saves the app build and capture on
  # every PR.
  landing-screenshots:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    # A cold e2e build takes up to 15 minutes, and the capture up to 10.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # A release event checks out the tag; deploy main instead so an older
          # tag never rolls the site back.
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || '' }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Use mold linker
        uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1

      # The same packages and cache entry as ci.yml's test-desktop-e2e: the
      # app's build dependencies, Xvfb, and Mesa's software Vulkan.
      - name: Install system packages
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev libgbm-dev libegl-dev libxdo-dev xvfb mesa-vulkan-drivers
          version: webkit-4.1-gpui-e2e-1
          execute_install_scripts: true

      # Reads test-rust's cache (warm-caches.yml saves it on main).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: false
          workspaces: |
            . -> target

      - name: Build the app with the e2e feature
        working-directory: src-tauri
        run: cargo build --locked --features e2e --bin treq

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/desktop/package-lock.json

      - name: Install the capture suite
        working-directory: e2e/desktop
        run: npm ci

      # The window renders at GDK_SCALE=2 (2800x1800), so the screen is larger
      # than the e2e job's.
      - name: Capture landing screenshots
        working-directory: e2e/desktop
        env:
          TREQ_E2E_BIN: ${{ github.workspace }}/target/debug/treq
        run: xvfb-run --auto-servernum --server-args="-screen 0 3840x2400x24" npm run landing

      - name: Stage landing screenshots
        run: node web/scripts/stage-landing-screenshots.mjs

      - name: Assert landing screenshots
        run: node web/scripts/assert-landing-screenshots.mjs

      - name: Upload landing screenshots
        uses: actions/upload-artifact@v7
        with:
          name: landing-screenshots
          path: |
            web/static/img/code.png
            web/static/img/landing
          if-no-files-found: error
          retention-days: 30

      - name: Upload the capture report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: landing-screenshots-report
          path: e2e/desktop/test-results
          retention-days: 7

  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: landing-screenshots
    if: always() && needs.landing-screenshots.result != 'failure' && needs.landing-screenshots.result != 'cancelled'
    defaults:
      run:
        shell: bash
        working-directory: web
    environment:
      name: ${{ (github.event_name == 'release' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'production' || 'preview' }}
      url: ${{ (github.event_name == 'release' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'https://treq.dev' || format('https://preview-{0}.treq-9zy.pages.dev', github.event.pull_request.number) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # A release event checks out the tag; deploy main instead so an older
          # tag never rolls the site back.
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || '' }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.3"
          cache: npm
          cache-dependency-path: 'web/package-lock.json'
      - name: Restore node_modules cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-docs-build-${{ hashFiles('web/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      # PR checks, formerly Web CI. They reuse this job's checkout and npm ci;
      # the build below covers what Web CI built.
      - name: Typecheck
        if: github.event_name == 'pull_request'
        run: npm run typecheck
      - name: Install uv
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Lint e2e tests (ast-grep)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        working-directory: ${{ github.workspace }}
        # Matches the root lockfile's @ast-grep/cli, without a root npm ci.
        run: |
          uvx --from ast-grep-cli==0.38.7 ast-grep test --skip-snapshot-tests
          uvx --from ast-grep-cli==0.38.7 ast-grep scan web/e2e
      - name: Lint (Biome)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        working-directory: ${{ github.workspace }}
        # Matches the root lockfile's @biomejs/biome and reads the root biome.json.
        run: npx --yes @biomejs/biome@2.4.7 lint web/src web/e2e web/plugins
      - name: Check docs readability
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        working-directory: ${{ github.workspace }}
        run: uv run .github/scripts/check_readability.py
      - name: Find main's latest landing screenshots
        id: main-shots
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        # The nightly run keeps a fresh artifact on main (30-day retention).
        run: |
          run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy-web.yml \
            --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId')
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
      # A missing artifact leaves the PNGs absent, and the build below fails
      # in assert-landing-screenshots.
      - name: Download landing screenshots
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: landing-screenshots
          path: /tmp/landing-screenshots
          run-id: ${{ steps.main-shots.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Build docs
        env:
          DOCUSAURUS_ENABLE_GTAG: ${{ (github.event_name == 'release' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'true' || 'false' }}
          # Authenticated GitHub API calls for the latest-release plugin.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_LANDING_SCREENSHOTS: "1"
        run: bash scripts/ci-deploy-web-build.sh /tmp/landing-screenshots
      - name: Publish to Production
        if: github.event_name == 'release' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=treq --branch=main
          workingDirectory: web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Preview
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=treq --branch=preview-${{ github.event.pull_request.number }}
          workingDirectory: web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  lighthouse:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Install lighthouse
        run: npm install -g lighthouse
      - name: Run Lighthouse against preview site
        run: |
          lighthouse "https://preview-${{ github.event.pull_request.number }}.treq-9zy.pages.dev" \
            --output html \
            --output-path /tmp/lighthouse-report.html \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --quiet
      - name: Upload Lighthouse report
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: /tmp/lighthouse-report.html
          retention-days: 30
      - name: Comment preview and Lighthouse links on PR
        uses: actions/github-script@v9
        with:
          script: |
            const previewUrl = `https://preview-${context.issue.number}.treq-9zy.pages.dev`;
            const artifactUrl = `${{ steps.upload.outputs.artifact-url }}`;
            const marker = '<!-- web-preview-link -->';
            const body = `${marker}\n🚀 Web preview: ${previewUrl}\n📊 Lighthouse report: ${artifactUrl}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
