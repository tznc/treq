name: Deploy Web

on:
  workflow_dispatch:
  # Only Docusaurus site changes.
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  # Rebuild so /version and the download links pick up the new release.
  release:
    types: [published]
  # Nightly production rebuild, an hour after the nightly build.
  schedule:
    - cron: "0 10 * * *"
  pull_request:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
      - ".github/scripts/check_readability.py"

# Production deploys queue behind each other. PR previews get a group per PR,
# so one PR's preview no longer cancels another's pending run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-web-pr-{0}', github.event.pull_request.number) || 'deploy-web' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  # The landing screenshots are committed (assets/screenshots/), not
  # captured here: the browser capture drove the React UI, which is gone.
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: web
    environment:
      name: ${{ (github.event_name == 'release' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'production' || 'preview' }}
      url: ${{ (github.event_name == 'release' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'https://treq.dev' || format('https://preview-{0}.treq-9zy.pages.dev', github.event.pull_request.number) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # A release event checks out the tag; deploy main instead so an older
          # tag never rolls the site back.
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || '' }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24.3"
          cache: npm
          cache-dependency-path: 'web/package-lock.json'
      - name: Restore node_modules cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-docs-build-${{ hashFiles('web/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      # PR checks, formerly Web CI. They reuse this job's checkout and npm ci;
      # the build below covers what Web CI built.
      - name: Typecheck
        if: github.event_name == 'pull_request'
        run: npm run typecheck
      - name: Install uv
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Lint e2e tests (ast-grep)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        working-directory: ${{ github.workspace }}
        # Matches the root lockfile's @ast-grep/cli, without a root npm ci.
        run: |
          uvx --from ast-grep-cli==0.38.7 ast-grep test --skip-snapshot-tests
          uvx --from ast-grep-cli==0.38.7 ast-grep scan web/e2e
      - name: Check docs readability
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        working-directory: ${{ github.workspace }}
        run: uv run .github/scripts/check_readability.py
      - name: Build docs
        env:
          DOCUSAURUS_ENABLE_GTAG: ${{ (github.event_name == 'release' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'true' || 'false' }}
          # Authenticated GitHub API calls for the latest-release plugin.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_LANDING_SCREENSHOTS: "1"
        run: bash scripts/ci-deploy-web-build.sh
      - name: Publish to Production
        if: github.event_name == 'release' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=treq --branch=main
          workingDirectory: web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Preview
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=treq --branch=preview-${{ github.event.pull_request.number }}
          workingDirectory: web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  lighthouse:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Install lighthouse
        run: npm install -g lighthouse
      - name: Run Lighthouse against preview site
        run: |
          lighthouse "https://preview-${{ github.event.pull_request.number }}.treq-9zy.pages.dev" \
            --output html \
            --output-path /tmp/lighthouse-report.html \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --quiet
      - name: Upload Lighthouse report
        id: upload
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-report
          path: /tmp/lighthouse-report.html
          retention-days: 30
      - name: Comment preview and Lighthouse links on PR
        uses: actions/github-script@v8
        with:
          script: |
            const previewUrl = `https://preview-${context.issue.number}.treq-9zy.pages.dev`;
            const artifactUrl = `${{ steps.upload.outputs.artifact-url }}`;
            const marker = '<!-- web-preview-link -->';
            const body = `${marker}\n🚀 Web preview: ${previewUrl}\n📊 Lighthouse report: ${artifactUrl}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
