name: Deploy Web

on:
  workflow_dispatch:
  # Only Docusaurus site changes. App changes reach the landing screenshots on
  # the next site change, release or nightly run.
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  # Rebuild so /version and the download links pick up the new release.
  release:
    types: [published]
  # Nightly production rebuild, an hour after the nightly build.
  schedule:
    - cron: "0 10 * * *"
  pull_request:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
      - ".github/scripts/check_readability.py"

# Production deploys queue behind each other. PR previews get a group per PR,
# so one PR's preview no longer cancels another's pending run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-web-pr-{0}', github.event.pull_request.number) || 'deploy-web' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # Production builds only. PR previews reuse main's latest screenshots (see
  # the build job), which saves the NAPI build and capture on every PR.
  landing-screenshots:
    permissions:
      contents: read
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          # A release event checks out the tag; deploy main instead so an older
          # tag never rolls the site back.
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || '' }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore NAPI addon cache
        id: napi-cache
        uses: actions/cache/restore@v5
        with:
          path: crates/treq-napi/treq-napi.linux-x64-gnu.node
          key: napi-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src-tauri/Cargo.toml', 'src-tauri/build.rs', 'src-tauri/src/**', 'src-tauri/tests/**', 'crates/treq-napi/Cargo.toml', 'crates/treq-napi/build.rs', 'crates/treq-napi/src/**', 'crates/treq-napi/package.json', 'crates/treq-napi/package-lock.json') }}

      - name: Install Rust stable
        if: steps.napi-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Install WebKit GTK headers
        if: steps.napi-cache.outputs.cache-hit != 'true'
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f # v1.6.1
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: webkit-4.1-1
          execute_install_scripts: true

      - name: Install npm dependencies
        run: npm ci

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.napi-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          cache-on-failure: true
          workspaces: |
            . -> target

      - name: Build NAPI addon
        if: steps.napi-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          ls -la crates || true
          ls -la crates/treq-napi || true
          npm run build:napi
          test -f crates/treq-napi/treq-napi.linux-x64-gnu.node

      - name: Save NAPI addon cache
        if: steps.napi-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: crates/treq-napi/treq-napi.linux-x64-gnu.node
          key: ${{ steps.napi-cache.outputs.cache-primary-key }}

      - name: Compile screenshot CSS
        continue-on-error: true
        run: npm run screenshot:css

      - name: Install Playwright Chromium
        continue-on-error: true
        run: npx playwright-core install --with-deps chromium

      - name: Capture landing screenshots
        continue-on-error: true
        run: |
          CHROME=$(node -p "require('playwright-core').chromium.executablePath()")
          test -x "$CHROME"
          PLAYWRIGHT_CHROMIUM_PATH="$CHROME" npx vitest run --config vitest.screenshot.config.ts scripts/screenshot/specs/readme-*.spec.tsx

      - name: Stage landing screenshots
        run: node web/scripts/stage-landing-screenshots.mjs

      - name: Assert landing screenshots
        run: node web/scripts/assert-landing-screenshots.mjs

      - name: Upload landing screenshots
        uses: actions/upload-artifact@v6
        with:
          name: landing-screenshots
          path: |
            web/static/img/code.png
            web/static/img/landing
          if-no-files-found: error
          retention-days: 3

  build:
    permissions:
      actions: read
      contents: read
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: landing-screenshots
    if: always() && needs.landing-screenshots.result != 'failure' && needs.landing-screenshots.result != 'cancelled'
    defaults:
      run:
        shell: bash
        working-directory: web
    environment:
      name: ${{ (github.event_name == 'release' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'production' || 'preview' }}
      url: ${{ (github.event_name == 'release' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'https://treq.dev' || format('https://preview-{0}.treq-9zy.pages.dev', github.event.pull_request.number) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          # A release event checks out the tag; deploy main instead so an older
          # tag never rolls the site back.
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || '' }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24.3"
          cache: npm
          cache-dependency-path: 'web/package-lock.json'
      - name: Restore node_modules cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-docs-build-${{ hashFiles('web/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      # PR checks, formerly Web CI. They reuse this job's checkout and npm ci;
      # the build below covers what Web CI built.
      - name: Typecheck
        if: github.event_name == 'pull_request'
        run: npm run typecheck
      - name: Install uv
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Lint e2e tests (ast-grep)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        working-directory: ${{ github.workspace }}
        # Matches the root lockfile's @ast-grep/cli, without a root npm ci.
        run: |
          uvx --from ast-grep-cli==0.38.7 ast-grep test --skip-snapshot-tests
          uvx --from ast-grep-cli==0.38.7 ast-grep scan web/e2e
      - name: Check docs readability
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        working-directory: ${{ github.workspace }}
        run: uv run .github/scripts/check_readability.py
      - name: Find main's latest landing screenshots
        id: main-shots
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        # The nightly run keeps a fresh artifact on main (3-day retention).
        run: |
          run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy-web.yml \
            --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId')
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download landing screenshots
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: landing-screenshots
          path: /tmp/landing-screenshots
          run-id: ${{ steps.main-shots.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Build docs
        env:
          DOCUSAURUS_ENABLE_GTAG: ${{ (github.event_name == 'release' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'true' || 'false' }}
          # Authenticated GitHub API calls for the latest-release plugin.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_LANDING_SCREENSHOTS: "1"
        run: bash scripts/ci-deploy-web-build.sh /tmp/landing-screenshots
      - name: Publish to Production
        if: github.event_name == 'release' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=treq --branch=main
          workingDirectory: web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Preview
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=treq --branch=preview-${{ github.event.pull_request.number }}
          workingDirectory: web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  lighthouse:
    permissions:
      pull-requests: write
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Install lighthouse
        run: npm install -g lighthouse
      - name: Run Lighthouse against preview site
        run: |
          lighthouse "https://preview-${{ github.event.pull_request.number }}.treq-9zy.pages.dev" \
            --output html \
            --output-path /tmp/lighthouse-report.html \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --quiet
      - name: Upload Lighthouse report
        id: upload
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-report
          path: /tmp/lighthouse-report.html
          retention-days: 30
      - name: Comment preview and Lighthouse links on PR
        uses: actions/github-script@v8
        with:
          script: |
            const previewUrl = `https://preview-${context.issue.number}.treq-9zy.pages.dev`;
            const artifactUrl = `${{ steps.upload.outputs.artifact-url }}`;
            const marker = '<!-- web-preview-link -->';
            const body = `${marker}\n🚀 Web preview: ${previewUrl}\n📊 Lighthouse report: ${artifactUrl}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
