name: Remote SSH Server Integration

# Real-`sshd` counterpart to the in-process mock-server unit tests in
# `core::remote_ssh_transport`'s `mod tests`. Starts an actual OpenSSH
# server via a step-managed `docker run` (not `services:` - see the "Start
# sshd container" step for why) and runs
# `src-tauri/tests/remote_ssh_server_it.rs` against it: publickey and
# certificate auth, host-key presentation (accepted and rejected before
# authentication), connection pooling, exec-channel round-tripping, and PTY
# start/IO/resize/close in a selected directory. See that test file's
# header for exactly what this does and does not prove, including that
# sshd KRLs are not used for client-key revocation (client cutoff is
# tested separately).

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0

on:
  pull_request:
    paths:
      - "src-tauri/src/core/remote_ssh_transport.rs"
      - "src-tauri/src/core/remote_ssh_ws_stream.rs"
      - "src-tauri/src/core/remote_control_plane.rs"
      - "src-tauri/src/core/remote.rs"
      - "src-tauri/tests/remote_ssh_server_it.rs"
      - "src-tauri/tests/fixtures/remote_ssh_it/**"
      - ".github/workflows/remote-ssh-server-it.yml"
  workflow_dispatch:

jobs:
  remote-ssh-server-it:
    name: Real sshd integration
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Restrict test private key permissions
        run: chmod 600 src-tauri/tests/fixtures/remote_ssh_it/id_ed25519

      - name: Generate test-only user CA and cert-only client key
        id: certsetup
        run: |
          set -euo pipefail
          # Throwaway CA + cert-only client key: generated per job, never
          # committed, never uploaded. The authorized bootstrap key remains
          # the fixture pair; the cert-only key is not in authorized_keys, so
          # certificate tests cannot accidentally succeed via publickey.
          umask 077
          CA_DIR="${RUNNER_TEMP:-/tmp}/treq-ssh-it-ca"
          mkdir -p "$CA_DIR"
          ssh-keygen -q -t ed25519 -N "" -C "treq-ci-user-ca (test-only, no real access)" -f "$CA_DIR/ca"
          ssh-keygen -q -t ed25519 -N "" -C "treq-ci-cert-only (test-only, no real access)" -f "$CA_DIR/cert_client"
          chmod 600 "$CA_DIR/ca" "$CA_DIR/cert_client"
          chmod 644 "$CA_DIR/ca.pub"
          echo "ca_dir=$CA_DIR" >> "$GITHUB_OUTPUT"

      - name: Write custom-cont-init script (TrustedUserCAKeys + workspace dir)
        id: custominit
        run: |
          set -euo pipefail
          # linuxserver images run every executable script under
          # /custom-cont-init.d *during* init, before sshd itself starts -
          # see https://docs.linuxserver.io/general/container-customization.
          # Doing this at first boot (rather than editing sshd_config over
          # SSH and restarting/reloading sshd afterwards, as an earlier
          # version of this job did) means sshd only ever starts once with
          # its final config - see "Start sshd container" below for why a
          # restart is not an option here.
          INIT_DIR="${RUNNER_TEMP:-/tmp}/treq-ssh-it-custom-init"
          mkdir -p "$INIT_DIR"
          cat > "$INIT_DIR/10-treq-ca-and-workspace.sh" <<'INIT'
          #!/bin/sh
          set -eu
          mkdir -p /config/sshd
          cp /treq-ci/ca.pub /config/sshd/treq_ca.pub
          chmod 644 /config/sshd/treq_ca.pub
          chown "$(id -u treq 2>/dev/null || echo 1000)" /config/sshd/treq_ca.pub 2>/dev/null || true
          # sshd_config is generated by an earlier init step, before this
          # custom-cont-init.d script runs (see linuxserver's container
          # customization docs) - append the CA trust directive to it here,
          # while sshd itself has not started yet. Older image versions
          # (pre-9.6, used here to avoid a russh/strict-kex incompatibility -
          # see the "Start sshd container" step) keep it at /etc/ssh
          # instead of the /config/sshd this image normally uses.
          cfg=""
          for candidate in /config/sshd/sshd_config /etc/ssh/sshd_config; do
            if [ -f "$candidate" ]; then
              cfg="$candidate"
              break
            fi
          done
          if [ -z "$cfg" ]; then
            echo "custom-init: could not find sshd_config in any known location" >&2
            exit 1
          fi
          if ! grep -q '^TrustedUserCAKeys /config/sshd/treq_ca.pub' "$cfg"; then
            printf '\nTrustedUserCAKeys /config/sshd/treq_ca.pub\n' >> "$cfg"
          fi
          mkdir -p /config/selected-workspace
          echo selected > /config/selected-workspace/marker
          INIT
          chmod +x "$INIT_DIR/10-treq-ca-and-workspace.sh"
          # The image refuses to run custom-cont-init.d scripts that aren't
          # root-owned (a real security check, not a bug) - files created by
          # this step are owned by the runner user, so fix that up before
          # mounting the directory in, or init silently skips with "No
          # custom services found" and the CA never gets installed.
          sudo chown -R root:root "$INIT_DIR"
          sudo chmod 755 "$INIT_DIR"
          echo "init_dir=$INIT_DIR" >> "$GITHUB_OUTPUT"

      # A step-managed `docker run` rather than `services:`: sshd needs
      # TrustedUserCAKeys present on its very first boot (see above), which
      # means the CA - generated per job, so only known once this job is
      # running - has to be mounted in before the container ever starts.
      # `services:` containers start before any step runs, so that ordering
      # is impossible there.
      #
      # Image pinned below OpenSSH 9.6, not `:latest` (currently OpenSSH
      # 10.3p1): every real connection through the production `russh`-based
      # transport against the 10.3p1 image failed immediately with
      # "Disconnected", with a tracing diagnostic showing `russh` never even
      # reaching "connection established" - not a config, restart, or
      # host-key-pinning problem, all independently verified sound (a plain
      # `ssh` CLI connection to the identical server worked instantly).
      # OpenSSH 9.6 is where the strict-kex extension (the Terrapin-attack
      # mitigation) landed; this is `russh` 0.63's client not completing that
      # negotiation against a strict-kex server. Pinning to 9.1p1 (pre-9.6)
      # sidesteps it until `russh` is upgraded past whatever version fixes
      # this - see https://github.com/Eugeny/russh for that fix landing, at
      # which point this can move back to `:latest`.
      - name: Start sshd container
        id: sshd
        run: |
          set -euo pipefail
          cid=$(docker run -d \
            -p 2222:2222 \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Etc/UTC \
            -e USER_NAME=treq \
            -e PUBLIC_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG6V1MZP6t97dWKMoMfmUOi/082R/d1r9CsNzIIvv5m1 treq-ci-remote-ssh-it (test-only, no real access)" \
            -e PASSWORD_ACCESS=false \
            -e SUDO_ACCESS=true \
            -v "${{ steps.certsetup.outputs.ca_dir }}/ca.pub:/treq-ci/ca.pub:ro" \
            -v "${{ steps.custominit.outputs.init_dir }}:/custom-cont-init.d:ro" \
            linuxserver/openssh-server:9.1_p1-r3-ls117)
          echo "container_id=$cid" >> "$GITHUB_OUTPUT"
          echo "Started openssh-server container $cid"

      - name: Wait for sshd to accept connections
        run: |
          for i in $(seq 1 60); do
            if (exec 3<>"/dev/tcp/127.0.0.1/2222") 2>/dev/null; then
              exec 3<&- 3>&-
              echo "sshd is accepting connections"
              exit 0
            fi
            sleep 1
          done
          echo "sshd never came up on 127.0.0.1:2222" >&2
          docker logs "${{ steps.sshd.outputs.container_id }}" || true
          exit 1

      - name: Discover the server's real host key fingerprints
        id: hostkey
        run: |
          set -euo pipefail
          # The TCP port accepting connections doesn't mean sshd is ready to
          # negotiate yet - a keyscan run right after can come back empty,
          # which (with pipefail) aborts the pipeline before the empty-check
          # even runs. Retry instead of trusting the first attempt.
          fingerprints=""
          for i in $(seq 1 30); do
            fingerprints=$(ssh-keyscan -p 2222 127.0.0.1 2>/dev/null \
              | ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}' | sort | paste -sd, - || true)
            if [ -n "$fingerprints" ]; then
              break
            fi
            sleep 1
          done
          if [ -z "$fingerprints" ]; then
            echo "failed to discover the server's host key fingerprints" >&2
            exit 1
          fi
          echo "Discovered host key fingerprints: $fingerprints"
          echo "fingerprint=$fingerprints" >> "$GITHUB_OUTPUT"

      - name: Confirm sshd accepts the bootstrap key and the CA was installed
        env:
          SSH_KEY: src-tauri/tests/fixtures/remote_ssh_it/id_ed25519
        run: |
          set -euo pipefail
          ssh_opts=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -i "$SSH_KEY" -p 2222 treq@127.0.0.1)
          for i in $(seq 1 30); do
            if ssh "${ssh_opts[@]}" 'true'; then
              break
            fi
            sleep 1
          done
          ssh "${ssh_opts[@]}" 'test -f /config/sshd/treq_ca.pub && test -d /config/selected-workspace'
          ssh "${ssh_opts[@]}" 'grep -q "^TrustedUserCAKeys /config/sshd/treq_ca.pub" /config/sshd/sshd_config 2>/dev/null \
            || grep -q "^TrustedUserCAKeys /config/sshd/treq_ca.pub" /etc/ssh/sshd_config 2>/dev/null'

      - name: Install stub treq CLI on the server
        # exec_command always runs `treq <args>` on the far end (see
        # build_remote_command_line in remote_ssh_transport.rs); this
        # minimal container has no GTK/WebKit runtime to run the real
        # desktop-linked `treq` binary, so a tiny stub stands in. It only
        # proves argument passing, stdout/stderr separation, and exit
        # codes survive a real SSH exec channel - see
        # remote_ssh_server_it.rs's header for what it does not prove.
        env:
          SSH_KEY: src-tauri/tests/fixtures/remote_ssh_it/id_ed25519
        run: |
          set -euo pipefail
          ssh_opts=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$SSH_KEY" -p 2222 treq@127.0.0.1)

          ssh "${ssh_opts[@]}" 'cat > /tmp/treq-stub.sh' <<'STUB'
          #!/bin/sh
          case "$1" in
            --version) echo "treq-ci-stub 0.0.0" ;;
            ok) echo "stub-ok:$2"; exit 0 ;;
            fail) echo "stub-fail:$2" >&2; exit 7 ;;
            sleep) sleep "$2"; echo "stub-slept:$2" ;;
            *) echo "unknown stub command: $*" >&2; exit 2 ;;
          esac
          STUB

          ssh "${ssh_opts[@]}" \
            'sudo mv /tmp/treq-stub.sh /usr/local/bin/treq && sudo chmod +x /usr/local/bin/treq'
          ssh "${ssh_opts[@]}" 'treq --version'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          # The CLI-only build below; a new key so the partial cache a
          # timed-out default-features build saved is not restored.
          key: no-default-features
          workspaces: |
            ./src-tauri -> target

      # Needed to link `treq` at all (see ci.yml's identical step) - not
      # needed to run it, since the real binary never leaves this runner.
      - name: install dependencies (ubuntu only)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev libgbm-dev libegl-dev libxdo-dev
          version: webkit-4.1-gpui-1
          execute_install_scripts: true

      - name: Build real-sshd integration tests
        working-directory: src-tauri
        run: cargo test --locked --no-default-features --test remote_ssh_server_it --no-run

      # Split from the build step and wrapped in `timeout`: the PTY tests
      # have hung with no further output and no error at least twice in a
      # row, consuming this job's entire 20-minute budget each time even
      # though open_in_directory is itself wrapped in a 10s
      # tokio::time::timeout in the test file - which means whatever's
      # actually stuck isn't yielding back to the async runtime, so that
      # inner timeout never gets a chance to fire. `timeout --signal=ABRT`
      # here forces the process to die (with a core-dumpable signal) after
      # a bound well under the job's own limit, and --nocapture streams
      # output live instead of only showing it for a test that finishes
      # (which a hung test never does), so a rerun's log shows exactly
      # what ran last before it stuck instead of nothing at all.
      - name: Run real-sshd integration tests
        working-directory: src-tauri
        env:
          RUST_BACKTRACE: 1
          TREQ_SSH_SERVER_IT: "1"
          TREQ_SSH_IT_HOST: "127.0.0.1"
          TREQ_SSH_IT_PORT: "2222"
          TREQ_SSH_IT_USERNAME: "treq"
          TREQ_SSH_IT_KEY_PATH: ${{ github.workspace }}/src-tauri/tests/fixtures/remote_ssh_it/id_ed25519
          TREQ_SSH_IT_HOST_KEY_ALGORITHM: "ssh-ed25519"
          TREQ_SSH_IT_HOST_KEY_FINGERPRINT: ${{ steps.hostkey.outputs.fingerprint }}
          TREQ_SSH_IT_CA_KEY_PATH: ${{ steps.certsetup.outputs.ca_dir }}/ca
          TREQ_SSH_IT_CERT_KEY_PATH: ${{ steps.certsetup.outputs.ca_dir }}/cert_client
          TREQ_SSH_IT_WORKSPACE_DIR: /config/selected-workspace
        run: |
          timeout --signal=ABRT 120 \
            cargo test --locked --no-default-features --test remote_ssh_server_it -- --test-threads=1 --nocapture

      - name: Show sshd container logs
        if: always()
        run: docker logs "${{ steps.sshd.outputs.container_id }}" || true

      - name: Stop sshd container
        if: always()
        run: docker rm -f "${{ steps.sshd.outputs.container_id }}" || true
