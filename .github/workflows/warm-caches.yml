name: Warm caches

# ci.yml only runs on pull_request, and an Actions cache
# saved from a PR can only be read by that PR. These jobs build on main and
# save under the default branch, which every PR can read, so a PR's first
# run starts warm. PR jobs restore these caches but never save their own.
#
# rust-cache keys hash every CARGO*/RUST* env var, so each job's env must
# match its consumer's exactly, or the keys never meet.
#
# These jobs get 30 minutes, not the 15 PR jobs get: they exist to absorb
# cold builds so PR jobs don't have to.
#
# test-macos also runs the macOS Rust tests, which PRs skip.
on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "crates/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/warm-caches.yml"
  workflow_dispatch:

# Merges can land faster than a cold build. Queue instead of cancelling, so
# a run always finishes and saves.
concurrency:
  group: warm-caches
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Consumer: ci.yml test-rust (clippy + tests, ubuntu).
  rust:
    name: clippy + test build / ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          components: rustfmt, clippy
          toolchain: stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest

      - name: Use mold linker
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1

      - name: install dependencies (ubuntu only)
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f # v1.6.1
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev libgbm-dev libegl-dev libxdo-dev
          version: webkit-4.1-gpui-1
          execute_install_scripts: true

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          workspaces: |
            . -> target

      - name: Build clippy artifacts
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets --all-features

      - name: Build test binaries
        working-directory: src-tauri
        run: cargo nextest run --locked --no-run

  # PRs only run test-rust on ubuntu. The macOS run happens here, after
  # merge, and also keeps its own cache warm.
  test-macos:
    name: test-rust / test / macos-latest
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest

      - name: Resolve jj release tag
        id: jj
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jj-vcs/jj/releases/latest | jq -r .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Restore jj CLI cache
        id: jj-cache
        uses: actions/cache/restore@v5
        with:
          path: .ci-bin
          key: jj-${{ runner.os }}-${{ runner.arch }}-${{ steps.jj.outputs.tag }}

      - name: Install jj CLI
        if: steps.jj-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JJ_TAG: ${{ steps.jj.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p .ci-bin
          tmp=$(mktemp -d)
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -L "https://github.com/jj-vcs/jj/releases/download/${JJ_TAG}/jj-${JJ_TAG}-aarch64-apple-darwin.tar.gz" \
            | tar -xz -C "$tmp"
          jj_bin=$(find "$tmp" -type f -name jj | head -n 1)
          test -n "$jj_bin"
          install -m 755 "$jj_bin" .ci-bin/jj

      - name: Save jj CLI cache
        if: steps.jj-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .ci-bin
          key: ${{ steps.jj-cache.outputs.cache-primary-key }}

      - name: Add jj to PATH
        run: echo "$GITHUB_WORKSPACE/.ci-bin" >> "$GITHUB_PATH"

      # Save the build even when a test fails, so the next run starts warm.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          cache-on-failure: true
          workspaces: |
            . -> target

      - name: Run Rust tests
        working-directory: src-tauri
        env:
          RUST_BACKTRACE: 1
        run: cargo nextest run --locked --profile ci
