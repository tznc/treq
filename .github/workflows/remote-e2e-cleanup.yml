name: Remote SSH e2e cleanup

# Dry-run orphan scan for the dedicated Remote SSH test project.
# Apply is never the default. Live deletes require workflow_dispatch with
# apply=true plus repository secrets for the dedicated test project and a
# separately scoped Sprites cleanup token.

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually delete (requires TREQ_REMOTE_E2E_CLEANUP_TARGET secret = dedicated-test)"
        type: boolean
        default: false
      min_age_hours:
        description: "Safety window in hours"
        type: string
        default: "2"

jobs:
  cleanup:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Unit tests against fixtures (no provider)
        run: deno test --allow-env scripts/remote-e2e-cleanup.test.ts
      - name: Dry-run or apply cleanup
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          TREQ_REMOTE_E2E_CLEANUP_TARGET: ${{ secrets.TREQ_REMOTE_E2E_CLEANUP_TARGET }}
          TREQ_SPRITES_E2E_CLEANUP_API_TOKEN: ${{ secrets.TREQ_SPRITES_E2E_CLEANUP_API_TOKEN }}
          TREQ_SPRITES_E2E_CLEANUP_API_URL: ${{ secrets.TREQ_SPRITES_E2E_CLEANUP_API_URL }}
        run: |
          if [ -z "$SUPABASE_TEST_URL" ] || [ -z "$SUPABASE_TEST_SERVICE_ROLE_KEY" ]; then
            echo "SKIP: dedicated test-project cleanup secrets are not configured"
            exit 0
          fi
          extra=(--min-age-hours="${{ github.event.inputs.min_age_hours || '2' }}")
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then
            extra+=(--apply)
          else
            extra+=(--dry-run)
          fi
          deno run --allow-net --allow-env scripts/remote-e2e-cleanup.ts "${extra[@]}"
