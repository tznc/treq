name: Nightly Build

defaults:
  run:
    shell: bash

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v5

      - name: Skip if main hasn't changed since last nightly
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          PREV_SHA=$(gh api "repos/${{ github.repository }}/git/refs/tags/nightly" \
            --jq '.object.sha' 2>/dev/null) || PREV_SHA=

          if [ "$HEAD_SHA" = "$PREV_SHA" ]; then
            echo "No new commits on main since last nightly build ($HEAD_SHA); skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  cleanup:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete pre-existing nightly release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # On 404, gh prints the error JSON to stdout, so discard output on failure.
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/nightly" --jq '.id' 2>/dev/null) || RELEASE_ID=

          if [ -n "$RELEASE_ID" ]; then
            echo "Deleting existing nightly release"
            gh api -X DELETE "repos/${{ github.repository }}/releases/${RELEASE_ID}"
          fi

          if gh api "repos/${{ github.repository }}/git/refs/tags/nightly" > /dev/null 2>&1; then
            echo "Deleting existing nightly tag"
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/nightly"
          fi

  release:
    needs: [check, cleanup]
    if: needs.check.outputs.should_run == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
            app_bundle: "target/aarch64-apple-darwin/release/bundle/macos/Treq.app"
          - platform: "macos-latest" # for Intel based macs.
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
            app_bundle: "target/x86_64-apple-darwin/release/bundle/macos/Treq.app"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            # Skip the AppImage: it adds ~1.5m to every nightly. Tagged
            # releases still ship it (release.yml builds all bundles).
            args: "--target x86_64-unknown-linux-gnu --bundles deb,rpm"
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: "--target x86_64-pc-windows-msvc"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 20
    environment: prod
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: "npm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: install dependencies (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libwayland-dev libx11-xcb-dev \
            libfontconfig-dev libfreetype-dev libgbm-dev libegl-dev libxdo-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          workspaces: ". -> target"

      - name: Install dependencies
        run: npm ci

      # Desktop only links the `treq` binary. The staticlib and cdylib crate
      # types exist for iOS/Android, and with LTO each
      # one is a separate whole-program link, roughly tripling link time.
      - name: Build only the rlib for desktop
        run: |
          sed -i.bak 's/^crate-type = .*/crate-type = ["rlib"]/' src-tauri/Cargo.toml
          grep -qx 'crate-type = \["rlib"\]' src-tauri/Cargo.toml
          rm src-tauri/Cargo.toml.bak

      # tauri-action finds the app by globbing for tauri.conf.json and takes
      # the first match, which is mobile-gpui/ (sorted before src-tauri/).
      # It then looks for the desktop bundles under mobile-gpui/target.
      - name: Hide the mobile-gpui Tauri config from tauri-action
        run: rm mobile-gpui/tauri.conf.json

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          # Nightlies trade a slightly larger binary for a much faster link.
          # Cargo.toml's release profile (fat LTO, 1 codegen unit) is kept
          # for tagged releases.
          CARGO_PROFILE_RELEASE_LTO: "thin"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: nightly
          releaseName: "Nightly Build"
          releaseBody: ""
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: true
          releaseAssetNamePattern: "[name]-nightly-[platform]-[arch][ext]"
          args: ${{ matrix.args }}

      - name: Verify packaged macOS bundle
        if: runner.os == 'macOS'
        run: bash scripts/verify-macos-bundle.sh "${{ matrix.app_bundle }}"

  # Release builds of the GPUI mobile app (mobile-gpui/), rendered through
  # tauri-plugin-gpui. They only run nightly (not on every PR) since the
  # Android/iOS toolchains are slow. mobile-gpui.yml builds and smoke-tests
  # the same app per push.
  #
  # Signed when the signing secrets exist: Android attaches a signed APK to the
  # nightly release (plus a signed AAB artifact for Play), iOS uploads to
  # TestFlight. Without them both fall back to the unsigned debug builds.
  # The run number is the build number, so every nightly upgrades in place.
  #
  # Nightlies track tauri-gpui main: each job bumps the locked plugin commit
  # to main's head before building, without committing the lockfile.
  android:
    name: android build (gpui)
    # Runs alongside the desktop builds; mobile-assets attaches the APK once
    # the nightly release exists.
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # The signing secrets live in the prod environment, as for the desktop
    # release job.
    environment: prod
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      NDK_VERSION: 27.0.12077973
      SIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: nightly-android
          workspaces: ./mobile-gpui -> target

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Track tauri-gpui main
        working-directory: mobile-gpui
        run: cargo update -p tauri-plugin-gpui

      # arm64 only: phones. The generated Gradle project calls back into the
      # Tauri CLI, so it is a local npm install.
      - name: Generate the Android project
        working-directory: mobile-gpui
        run: |
          npm install --no-audit --no-fund
          npm run tauri -- android init --ci
          scripts/apply-icons.sh

      - name: Add release signing
        if: env.SIGNED == 'true'
        working-directory: mobile-gpui
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: scripts/android-signing.sh

      - name: Build APK
        working-directory: mobile-gpui
        run: |
          config='{"bundle":{"android":{"versionCode":${{ github.run_number }}}}}'
          if [ "$SIGNED" = true ]; then
            npm run tauri -- android build --apk --aab --target aarch64 --ci --config "$config"
            apk=$(find gen/android/app/build/outputs/apk -name '*-release.apk' | head -n1)
            aab=$(find gen/android/app/build/outputs/bundle -name '*-release.aab' | head -n1)
            test -n "$aab"
            cp "$aab" "$GITHUB_WORKSPACE/treq-nightly-android.aab"
          else
            npm run tauri -- android build --debug --apk --target aarch64 --ci --config "$config"
            apk=$(find gen/android/app/build/outputs/apk -name '*.apk' | head -n1)
          fi
          test -n "$apk"
          ls -la "$apk"
          cp "$apk" "$GITHUB_WORKSPACE/treq-nightly-android-arm64.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: |
            treq-nightly-android-arm64.apk
            treq-nightly-android.aab
          if-no-files-found: error
          retention-days: 7

  ios:
    name: ios build (gpui)
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    # The signing secrets live in the prod environment, as for the desktop
    # release job.
    environment: prod
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      SIGNED: ${{ secrets.IOS_CERTIFICATE_P12 != '' && secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: nightly-ios
          workspaces: ./mobile-gpui -> target

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      # - Track tauri-gpui main, as the Android job does.
      # - libc 0.2.190 made the `_dyld_*` functions macOS-only, which breaks
      #   `backtrace` (and with it GPUI) on iOS. tauri-gpui's README pins 0.2.189.
      # - No `cdylib` on iOS: GPUI's core-video dependency asks rustc to link
      #   the OpenGL framework, which iOS lacks. Xcode links the staticlib.
      - name: Prepare the crate for iOS
        working-directory: mobile-gpui
        run: |
          cargo update -p tauri-plugin-gpui
          cargo update -p libc --precise 0.2.189
          sed -i.bak 's/^crate-type = .*/crate-type = ["staticlib", "rlib"]/' Cargo.toml
          grep -qx 'crate-type = \["staticlib", "rlib"\]' Cargo.toml
          rm Cargo.toml.bak

      - name: Generate the Xcode project
        working-directory: mobile-gpui
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # An empty team fails `ios init`; unset it for the unsigned build.
          [ -n "$APPLE_DEVELOPMENT_TEAM" ] || unset APPLE_DEVELOPMENT_TEAM
          command -v xcodegen >/dev/null || brew install xcodegen
          npm install --no-audit --no-fund
          npm run tauri -- ios init --ci
          scripts/apply-icons.sh

      # The Tauri CLI imports IOS_CERTIFICATE into a temporary keychain and,
      # given the App Store Connect API key, lets Xcode create the App Store
      # provisioning profile.
      - name: Build signed .ipa
        if: env.SIGNED == 'true'
        working-directory: mobile-gpui
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          keydir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$keydir"
          printf '%s' "$APPLE_API_KEY_P8" > "$keydir/AuthKey_$APPLE_API_KEY.p8"
          export APPLE_API_KEY_PATH="$keydir/AuthKey_$APPLE_API_KEY.p8"
          config='{"bundle":{"iOS":{"bundleVersion":"${{ github.run_number }}"}}}'
          npm run tauri -- ios build --target aarch64 --export-method app-store-connect --ci --config "$config"
          ipa=$(find gen/apple/build -name '*.ipa' | head -n 1)
          test -n "$ipa"
          cp "$ipa" "$RUNNER_TEMP/treq.ipa"

      - name: Upload to TestFlight
        if: env.SIGNED == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/treq.ipa" \
            --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"

      - name: Remove the API key
        if: always()
        run: rm -rf "$HOME/.appstoreconnect"

      # Without signing secrets: simulator build, since device builds need a
      # development team and certificate.
      - name: Build debug app bundle (simulator)
        if: env.SIGNED != 'true'
        working-directory: mobile-gpui
        run: |
          npm run tauri -- ios build --debug --target aarch64-sim --no-sign --ci
          app=$(find gen/apple/build -name '*.app' -path '*arm64-sim*' -maxdepth 3 | head -n 1)
          test -n "$app"
          # Simulator only: unzip, then `xcrun simctl install booted <app>`.
          ditto -c -k --keepParent "$app" "$GITHUB_WORKSPACE/treq-nightly-ios-simulator-arm64.zip"

      - name: Upload app bundle
        if: env.SIGNED != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ios-simulator-app
          path: treq-nightly-ios-simulator-arm64.zip
          if-no-files-found: error
          retention-days: 7

  # Attaches the mobile builds to the nightly release, which the release job
  # recreates. Still runs if a desktop target fails; the release exists
  # either way.
  mobile-assets:
    name: attach mobile builds
    needs: [check, release, android, ios]
    if: ${{ !cancelled() && needs.check.outputs.should_run == 'true' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: "{android-apk,ios-simulator-app}"
          merge-multiple: true
      - name: Attach to nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=$(ls treq-nightly-android-arm64.apk treq-nightly-ios-simulator-arm64.zip 2>/dev/null || true)
          test -n "$files" || { echo "no mobile builds to attach"; exit 0; }
          gh release upload nightly $files --clobber --repo "${{ github.repository }}"
