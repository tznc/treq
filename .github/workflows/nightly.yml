name: Nightly Build

defaults:
  run:
    shell: bash

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v5

      - name: Skip if main hasn't changed since last nightly
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          PREV_SHA=$(gh api "repos/${{ github.repository }}/git/refs/tags/nightly" \
            --jq '.object.sha' 2>/dev/null) || PREV_SHA=

          if [ "$HEAD_SHA" = "$PREV_SHA" ]; then
            echo "No new commits on main since last nightly build ($HEAD_SHA); skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  cleanup:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete pre-existing nightly release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # On 404, gh prints the error JSON to stdout, so discard output on failure.
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/nightly" --jq '.id' 2>/dev/null) || RELEASE_ID=

          if [ -n "$RELEASE_ID" ]; then
            echo "Deleting existing nightly release"
            gh api -X DELETE "repos/${{ github.repository }}/releases/${RELEASE_ID}"
          fi

          if gh api "repos/${{ github.repository }}/git/refs/tags/nightly" > /dev/null 2>&1; then
            echo "Deleting existing nightly tag"
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/nightly"
          fi

  release:
    needs: [check, cleanup]
    if: needs.check.outputs.should_run == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
            app_bundle: "target/aarch64-apple-darwin/release/bundle/macos/Treq.app"
          - platform: "macos-latest" # for Intel based macs.
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
            app_bundle: "target/x86_64-apple-darwin/release/bundle/macos/Treq.app"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            # Skip the AppImage: it adds ~1.5m to every nightly. Tagged
            # releases still ship it (release.yml builds all bundles).
            args: "--target x86_64-unknown-linux-gnu --bundles deb,rpm"
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: "--target x86_64-pc-windows-msvc"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    environment: prod
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: "npm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: install dependencies (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libwayland-dev libx11-xcb-dev \
            libfontconfig-dev libfreetype-dev libgbm-dev libegl-dev libxdo-dev

      # rust-cache only keeps third-party crates; sccache also caches the
      # treq crates, which are most of each build.
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          workspaces: ". -> target"

      - name: Install dependencies
        run: npm ci

      # Desktop only links the `treq` binary. The staticlib and cdylib crate
      # types exist for iOS/Android, and with LTO each
      # one is a separate whole-program link, roughly tripling link time.
      - name: Build only the rlib for desktop
        run: |
          sed -i.bak 's/^crate-type = .*/crate-type = ["rlib"]/' src-tauri/Cargo.toml
          grep -qx 'crate-type = \["rlib"\]' src-tauri/Cargo.toml
          rm src-tauri/Cargo.toml.bak

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          # Nightlies trade a slightly larger binary for a much faster link.
          # Cargo.toml's release profile (fat LTO, 1 codegen unit) is kept
          # for tagged releases.
          CARGO_PROFILE_RELEASE_LTO: "thin"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: nightly
          releaseName: "Nightly Build"
          releaseBody: ""
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: true
          releaseAssetNamePattern: "[name]-nightly-[platform]-[arch][ext]"
          args: ${{ matrix.args }}

      - name: Verify packaged macOS bundle
        if: runner.os == 'macOS'
        run: bash scripts/verify-macos-bundle.sh "${{ matrix.app_bundle }}"

  # Release builds of the GPUI mobile app (src-tauri with the `mobile-ui`
  # feature), rendered through tauri-plugin-gpui. They only run nightly (not on every PR) since the
  # Android/iOS toolchains are slow. mobile-gpui.yml builds and smoke-tests
  # the same app per push.
  #
  # Signed when the signing secrets exist: Android attaches a signed APK to the
  # nightly release (plus a signed AAB artifact for Play), iOS uploads to
  # TestFlight. Without them both fall back to the unsigned debug builds.
  # The run number is the build number, so every nightly upgrades in place.
  android:
    name: android build (gpui)
    # Runs alongside the desktop builds; mobile-assets attaches the APK once
    # the nightly release exists.
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # The signing secrets live in the prod environment, as for the desktop
    # release job.
    environment: prod
    env:
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      NDK_VERSION: 27.0.12077973
      SIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: aarch64-linux-android

      # rust-cache only keeps third-party crates; sccache also caches the
      # treq crates, which are most of each build.
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: nightly-android
          workspaces: ". -> target"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      # arm64 only: phones. The generated Gradle project calls back into the
      # Tauri CLI, so it is a local npm install.
      - name: Generate the Android project
        run: |
          npm ci --no-audit --no-fund
          npm run tauri -- android init --ci
          scripts/mobile/apply-icons.sh
          # `android init` regenerates gen/android without the plugin entries;
          # only treq's build script adds them back (tauri-plugin-gpui's
          # GpuiView), and a warm Rust cache skips it. Force it to rerun.
          cargo clean -p treq --target aarch64-linux-android

      - name: Add release signing
        if: env.SIGNED == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: scripts/mobile/android-signing.sh

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          config='{"bundle":{"android":{"versionCode":${{ github.run_number }}}}}'
          if [ "$SIGNED" = true ]; then
            # `--apk --aab` runs Gradle's Rust build once per output. Build
            # the AAB only and derive a signed universal APK from it.
            npm run tauri -- android build --features mobile-ui --aab --target aarch64 --ci --config "$config"
            aab=$(find src-tauri/gen/android/app/build/outputs/bundle -name '*-release.aab' | head -n1)
            test -n "$aab"
            cp "$aab" "$GITHUB_WORKSPACE/treq-nightly-android.aab"
            curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" \
              https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
            # bundletool takes only `pass:` or `file:` passwords; a file keeps
            # the secret out of the process arguments.
            ks_pass=$RUNNER_TEMP/ks-pass
            (umask 077; printf '%s' "$ANDROID_KEYSTORE_PASSWORD" > "$ks_pass")
            trap 'rm -f "$ks_pass"' EXIT
            java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --mode=universal \
              --bundle="$aab" --output="$RUNNER_TEMP/treq.apks" \
              --ks=src-tauri/gen/android/upload.jks --ks-key-alias="$ANDROID_KEY_ALIAS" \
              --ks-pass="file:$ks_pass" --key-pass="file:$ks_pass"
            rm -f "$ks_pass"
            unzip -o -q "$RUNNER_TEMP/treq.apks" universal.apk -d "$RUNNER_TEMP"
            apk=$RUNNER_TEMP/universal.apk
          else
            npm run tauri -- android build --features mobile-ui --debug --apk --target aarch64 --ci --config "$config"
            apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n1)
          fi
          test -n "$apk"
          ls -la "$apk"
          cp "$apk" "$GITHUB_WORKSPACE/treq-nightly-android-arm64.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: |
            treq-nightly-android-arm64.apk
            treq-nightly-android.aab
          if-no-files-found: error
          retention-days: 7

  ios:
    name: ios build (gpui)
    needs: check
    if: needs.check.outputs.should_run == 'true'
    # App Store Connect only accepts builds from the iOS 26 SDK (Xcode 26).
    runs-on: macos-26
    timeout-minutes: 90
    # The signing secrets live in the prod environment, as for the desktop
    # release job.
    environment: prod
    env:
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      SIGNED: ${{ secrets.IOS_CERTIFICATE_P12 != '' && secrets.IOS_MOBILE_PROVISION != '' && secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      # rust-cache only keeps third-party crates; sccache also caches the
      # treq crates, which are most of each build.
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: nightly-ios
          workspaces: ". -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      # No `cdylib` on iOS: GPUI's core-video dependency asks rustc to link
      # the OpenGL framework, which iOS lacks. Xcode links the staticlib.
      # (The lockfile keeps libc at 0.2.189: 0.2.190 made the `_dyld_*`
      # functions macOS-only, which breaks `backtrace`, and GPUI, on iOS.)
      - name: Prepare the crate for iOS
        run: |
          sed -i.bak 's/^crate-type = .*/crate-type = ["staticlib", "rlib"]/' src-tauri/Cargo.toml
          grep -qx 'crate-type = \["staticlib", "rlib"\]' src-tauri/Cargo.toml
          rm src-tauri/Cargo.toml.bak

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate the Xcode project
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # An empty team fails `ios init`; unset it for the unsigned build.
          [ -n "$APPLE_DEVELOPMENT_TEAM" ] || unset APPLE_DEVELOPMENT_TEAM
          command -v xcodegen >/dev/null || brew install xcodegen
          npm ci --no-audit --no-fund
          npm run tauri -- ios init --ci
          scripts/mobile/apply-icons.sh

      # The Tauri CLI imports IOS_CERTIFICATE into a temporary keychain and
      # signs with the App Store profile in IOS_MOBILE_PROVISION; it ignores
      # the certificate without the profile.
      - name: Build signed .ipa
        if: env.SIGNED == 'true'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          keydir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$keydir"
          printf '%s' "$APPLE_API_KEY_P8" > "$keydir/AuthKey_$APPLE_API_KEY.p8"
          export APPLE_API_KEY_PATH="$keydir/AuthKey_$APPLE_API_KEY.p8"
          config='{"bundle":{"iOS":{"bundleVersion":"${{ github.run_number }}"}}}'
          npm run tauri -- ios build --features mobile-ui --target aarch64 --export-method app-store-connect --ci --config "$config"
          ipa=$(find src-tauri/gen/apple/build -name '*.ipa' | head -n 1)
          test -n "$ipa"
          # App Store Connect rejects an .ipa without its profile.
          unzip -Z1 "$ipa" | grep 'Payload/.*\.app/embedded\.mobileprovision$' >/dev/null \
            || { echo "::error::$ipa has no embedded.mobileprovision"; exit 1; }
          cp "$ipa" "$RUNNER_TEMP/treq.ipa"

      - name: Upload to TestFlight
        if: env.SIGNED == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/treq.ipa" \
            --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"

      - name: Remove the API key
        if: always()
        run: rm -rf "$HOME/.appstoreconnect"

      # Without signing secrets: simulator build, since device builds need a
      # development team and certificate.
      - name: Build debug app bundle (simulator)
        if: env.SIGNED != 'true'
        run: |
          npm run tauri -- ios build --features mobile-ui --debug --target aarch64-sim --no-sign --ci
          app=$(find src-tauri/gen/apple/build -name '*.app' -path '*arm64-sim*' -maxdepth 3 | head -n 1)
          test -n "$app"
          # Simulator only: unzip, then `xcrun simctl install booted <app>`.
          ditto -c -k --keepParent "$app" "$GITHUB_WORKSPACE/treq-nightly-ios-simulator-arm64.zip"

      - name: Upload app bundle
        if: env.SIGNED != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ios-simulator-app
          path: treq-nightly-ios-simulator-arm64.zip
          if-no-files-found: error
          retention-days: 7

  # Attaches the mobile builds to the nightly release, which the release job
  # recreates. Still runs if a desktop target fails; the release exists
  # either way.
  mobile-assets:
    name: attach mobile builds
    needs: [check, release, android, ios]
    if: ${{ !cancelled() && needs.check.outputs.should_run == 'true' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: "{android-apk,ios-simulator-app}"
          merge-multiple: true
      - name: Attach to nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=$(ls treq-nightly-android-arm64.apk treq-nightly-ios-simulator-arm64.zip 2>/dev/null || true)
          test -n "$files" || { echo "no mobile builds to attach"; exit 0; }
          gh release upload nightly $files --clobber --repo "${{ github.repository }}"
