name: Nightly Build

defaults:
  run:
    shell: bash

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if main hasn't changed since last nightly
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          PREV_SHA=$(gh api "repos/${{ github.repository }}/git/refs/tags/nightly" \
            --jq '.object.sha' 2>/dev/null) || PREV_SHA=

          if [ "$HEAD_SHA" = "$PREV_SHA" ]; then
            echo "No new commits on main since last nightly build ($HEAD_SHA); skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  cleanup:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete pre-existing nightly release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # On 404, gh prints the error JSON to stdout, so discard output on failure.
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/nightly" --jq '.id' 2>/dev/null) || RELEASE_ID=

          if [ -n "$RELEASE_ID" ]; then
            echo "Deleting existing nightly release"
            gh api -X DELETE "repos/${{ github.repository }}/releases/${RELEASE_ID}"
          fi

          if gh api "repos/${{ github.repository }}/git/refs/tags/nightly" > /dev/null 2>&1; then
            echo "Deleting existing nightly tag"
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/nightly"
          fi

  release:
    needs: [check, cleanup]
    if: needs.check.outputs.should_run == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
            app_bundle: "target/aarch64-apple-darwin/release/bundle/macos/Treq.app"
          - platform: "macos-latest" # for Intel based macs.
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
            app_bundle: "target/x86_64-apple-darwin/release/bundle/macos/Treq.app"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            # Skip the AppImage: it adds ~1.5m to every nightly. Tagged
            # releases still ship it (release.yml builds all bundles).
            args: "--target x86_64-unknown-linux-gnu --bundles deb,rpm"
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: "--target x86_64-pc-windows-msvc"
    runs-on: ${{ matrix.platform }}
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install dependencies (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: ". -> target"

      - name: Install dependencies
        run: npm ci

      # Desktop only links the `treq` binary. The staticlib and cdylib crate
      # types exist for iOS/Android and the NAPI test addon, and with LTO each
      # one is a separate whole-program link, roughly tripling link time.
      - name: Build only the rlib for desktop
        run: |
          sed -i.bak 's/^crate-type = .*/crate-type = ["rlib"]/' src-tauri/Cargo.toml
          grep -qx 'crate-type = \["rlib"\]' src-tauri/Cargo.toml
          rm src-tauri/Cargo.toml.bak

      - uses: tauri-apps/tauri-action@v0
        env:
          # Nightlies trade a slightly larger binary for a much faster link.
          # Cargo.toml's release profile (fat LTO, 1 codegen unit) is kept
          # for tagged releases.
          CARGO_PROFILE_RELEASE_LTO: "thin"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: nightly
          releaseName: "Nightly Build"
          releaseBody: ""
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: true
          releaseAssetNamePattern: "[name]-nightly-[platform]-[arch][ext]"
          args: ${{ matrix.args }}

      - name: Verify packaged macOS bundle
        if: runner.os == 'macOS'
        run: bash scripts/verify-macos-bundle.sh "${{ matrix.app_bundle }}"

  # Unsigned debug builds of the GPUI mobile app (mobile-gpui/), rendered
  # through tauri-plugin-gpui. They only run nightly (not on every PR) since
  # the Android/iOS toolchains are slow. mobile-gpui.yml builds and
  # smoke-tests the same app per push; signed webview builds live in mobile.yml.
  #
  # Nightlies track tauri-gpui main: each job bumps the locked plugin commit
  # to main's head before building, without committing the lockfile.
  android:
    name: android build (gpui, unsigned debug)
    # After release, so the nightly release exists to attach the APK to.
    needs: [check, release]
    # Still build if one desktop target fails; the release exists either way.
    if: ${{ !cancelled() && needs.check.outputs.should_run == 'true' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: 0
      NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: nightly-android
          workspaces: ./mobile-gpui -> target

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # treq_lib embeds the desktop frontend, which this app does not use.
      - name: Placeholder frontend dist
        run: mkdir -p src/dist && echo '<!doctype html>' > src/dist/index.html

      - name: Track tauri-gpui main
        working-directory: mobile-gpui
        run: cargo update -p tauri-plugin-gpui

      # arm64 only: phones. The generated Gradle project calls back into the
      # Tauri CLI, so it is a local npm install.
      - name: Build debug APK
        working-directory: mobile-gpui
        run: |
          npm install --no-audit --no-fund
          npm run tauri -- android init --ci
          npm run tauri -- android build --debug --apk --target aarch64 --ci
          apk=$(find gen/android/app/build/outputs/apk -name '*.apk' | head -n1)
          test -n "$apk"
          ls -la "$apk"
          cp "$apk" "$GITHUB_WORKSPACE/treq-nightly-android-arm64.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: treq-nightly-android-arm64.apk
          if-no-files-found: error
          retention-days: 7

      - name: Attach APK to nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload nightly treq-nightly-android-arm64.apk --clobber

  ios:
    name: ios build (gpui, unsigned debug)
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: nightly-ios
          workspaces: ./mobile-gpui -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Placeholder frontend dist
        run: mkdir -p src/dist && echo '<!doctype html>' > src/dist/index.html

      # - Track tauri-gpui main, as the Android job does.
      # - libc 0.2.190 made the `_dyld_*` functions macOS-only, which breaks
      #   `backtrace` (and with it GPUI) on iOS. tauri-gpui's README pins 0.2.189.
      # - No `cdylib` on iOS: GPUI's core-video dependency asks rustc to link
      #   the OpenGL framework, which iOS lacks. Xcode links the staticlib.
      - name: Prepare the crate for iOS
        working-directory: mobile-gpui
        run: |
          cargo update -p tauri-plugin-gpui
          cargo update -p libc --precise 0.2.189
          sed -i.bak 's/^crate-type = .*/crate-type = ["staticlib", "rlib"]/' Cargo.toml
          grep -qx 'crate-type = \["staticlib", "rlib"\]' Cargo.toml
          rm Cargo.toml.bak

      # Simulator build: device builds need a development team (see PR #495).
      - name: Build debug app bundle (simulator)
        working-directory: mobile-gpui
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          npm install --no-audit --no-fund
          npm run tauri -- ios init --ci
          npm run tauri -- ios build --debug --target aarch64-sim --no-sign --ci
          app=$(find gen/apple/build -name '*.app' -path '*arm64-sim*' -maxdepth 3 | head -n 1)
          test -n "$app"
          ditto "$app" "$RUNNER_TEMP/app/$(basename "$app")"

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-app
          path: ${{ runner.temp }}/app
          if-no-files-found: error
          retention-days: 7
