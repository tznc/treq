name: Windows Tests

# Separate from nightly.yml so a Windows test failure doesn't mark the
# nightly build red, and so it can be re-run on its own.

defaults:
  run:
    shell: bash

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily, alongside the nightly build
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # Windows tests run nightly instead of on PRs: they are slow and only ever
  # catch bugs in code that branches on the Windows target.
  windows-rust-tests:
    name: rust / test / windows-latest
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      # Windows Defender's real-time scanning intercepts every process spawn
      # and file write; this job spawns hundreds of jj/git subprocesses per
      # test run, so this materially cuts wall time. Exclude the workspace
      # before checkout writes anything into it.
      - name: Disable Defender scanning
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          components: rustfmt
          toolchain: stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest

      # windows-latest runners ship LLVM (lld-link.exe) but link.exe from MSVC
      # is the default; switch to lld for a much faster linker on Windows.
      - name: Use lld linker
        run: |
          echo "RUSTFLAGS=-C linker=lld-link" >> "$GITHUB_ENV"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Configure sccache
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      # Runners already ship git + gh. Only jj needs installing; cache the
      # release binary.
      - name: Resolve jj release tag
        id: jj
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jj-vcs/jj/releases/latest | jq -r .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Restore jj CLI cache
        id: jj-cache
        uses: actions/cache/restore@v5
        with:
          path: .ci-bin
          key: jj-${{ runner.os }}-${{ runner.arch }}-${{ steps.jj.outputs.tag }}

      - name: Install jj CLI
        if: steps.jj-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JJ_TAG: ${{ steps.jj.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p .ci-bin
          asset="jj-${JJ_TAG}-x86_64-pc-windows-msvc.zip"
          tmp=$(mktemp -d)
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -L "https://github.com/jj-vcs/jj/releases/download/${JJ_TAG}/${asset}" \
            -o "$tmp/jj.zip"
          unzip -q "$tmp/jj.zip" -d "$tmp"
          jj_bin=$(find "$tmp" -type f -name jj.exe | head -n 1)
          test -n "$jj_bin"
          install -m 755 "$jj_bin" .ci-bin/jj.exe

      - name: Save jj CLI cache
        if: steps.jj-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .ci-bin
          key: ${{ steps.jj-cache.outputs.cache-primary-key }}

      - name: Add jj to PATH
        run: echo "$GITHUB_WORKSPACE/.ci-bin" >> "$GITHUB_PATH"

      - name: Verify tool versions
        run: |
          git --version
          jj --version
          gh --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target

      - name: Run Rust task
        working-directory: src-tauri
        env:
          RUST_BACKTRACE: 1
        run: cargo nextest run --locked --profile ci
