name: Mobile

defaults:
  run:
    shell: bash

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

jobs:
  # Signed release builds. These need real signing material, which forked
  # PRs never have (GitHub does not expose secrets to fork PR runs at all,
  # and `pull_request` events for same-repo PRs also skip environment
  # secrets unless the environment is configured to allow them). Gating on
  # `github.event_name != 'pull_request'` keeps this job from ever running
  # against a PR - it only fires on pushes to `main`, tag pushes, and manual
  # dispatch, the same trigger shape release.yml already uses for the
  # desktop signed build. The `if` on each job body additionally checks that
  # the relevant secrets are actually set, so a manual dispatch or a push to
  # `main` before secrets are configured fails fast with a clear log message
  # instead of a confusing signing-tool error.
  #
  # Required secrets (all optional - jobs no-op without them):
  #
  # Android (see "Android release signing" below for what each maps to):
  #   ANDROID_KEYSTORE_BASE64    - base64-encoded .jks/.keystore file
  #   ANDROID_KEYSTORE_PASSWORD  - keystore password
  #   ANDROID_KEY_ALIAS          - key alias inside the keystore
  #   ANDROID_KEY_PASSWORD       - password for that key (often same as above)
  #
  # iOS (see "iOS release signing" below):
  #   IOS_CERTIFICATE_BASE64            - base64-encoded .p12 signing certificate
  #   IOS_CERTIFICATE_PASSWORD          - password for the .p12
  #   IOS_PROVISIONING_PROFILE_BASE64   - base64-encoded .mobileprovision
  #   IOS_TEAM_ID                       - Apple Developer Team ID
  #   IOS_KEYCHAIN_PASSWORD             - password for the temporary CI keychain
  #                                        (any value; only used within this job)
  #
  # This has not been exercised with real secrets in this environment (no
  # Apple Developer account / Android signing key available here) - the YAML
  # and shell here are correct by inspection, but an actual signed build has
  # not been produced or tested. See prds/mobile.md Phase 2 for the same
  # caveat tracked in the PRD.
  android-release:
    name: Android (signed release)
    runs-on: ubuntu-22.04
    if: >-
      github.event_name != 'pull_request' &&
      github.repository_owner == 'treq-dev'
    environment: prod
    steps:
      - uses: actions/checkout@v5

      - name: Check required secrets are configured
        id: secrets_check
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || \
             [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || \
             [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] || \
             [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "Android signing secrets are not configured; skipping the signed release build."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.secrets_check.outputs.configured == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        if: steps.secrets_check.outputs.configured == 'true'
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.secrets_check.outputs.configured == 'true'
        with:
          cache-on-failure: true
          workspaces: |
            ./src-tauri -> target

      - name: Setup Java
        if: steps.secrets_check.outputs.configured == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK/NDK
        if: steps.secrets_check.outputs.configured == 'true'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Install NDK
        if: steps.secrets_check.outputs.configured == 'true'
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Install dependencies
        if: steps.secrets_check.outputs.configured == 'true'
        run: npm ci

      - name: Init Android project
        if: steps.secrets_check.outputs.configured == 'true'
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: npm run mobile:android:init

      # Android release signing: `tauri android init` scaffolds a Gradle
      # project under `src-tauri/gen/android` whose app-level build.gradle.kts
      # reads a `keystore.properties` file (standard Android/Gradle
      # convention - not Tauri-specific) if present, and wires it into the
      # `release` signing config. We decode the keystore secret to a file
      # outside the repo and write `keystore.properties` pointing at it, so
      # `tauri android build` picks up real signing without the keystore or
      # its passwords ever touching the checked-out tree or build logs.
      - name: Configure Android release signing
        if: steps.secrets_check.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/treq-release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          {
            echo "storeFile=$KEYSTORE_PATH"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties

      - name: Build signed release APK/AAB
        if: steps.secrets_check.outputs.configured == 'true'
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: npm run mobile:android:build

      - name: Upload signed release artifacts
        if: steps.secrets_check.outputs.configured == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: android-release-signed
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

      # `keystore.properties` holds the plaintext store/key passwords and,
      # unlike the keystore binary itself, has to live at this conventional
      # in-tree Gradle path for the signing config to pick it up. Remove it
      # once the build is done (even on failure) so it's not left in the
      # working tree for any later step, artifact upload, or debug log to
      # touch.
      - name: Remove keystore.properties
        if: steps.secrets_check.outputs.configured == 'true' && always()
        run: rm -f src-tauri/gen/android/keystore.properties

  ios-release:
    name: iOS (signed archive)
    runs-on: macos-latest
    if: >-
      github.event_name != 'pull_request' &&
      github.repository_owner == 'treq-dev'
    environment: prod
    steps:
      - uses: actions/checkout@v5

      - name: Check required secrets are configured
        id: secrets_check
        run: |
          if [ -z "${{ secrets.IOS_CERTIFICATE_BASE64 }}" ] || \
             [ -z "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" ] || \
             [ -z "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" ] || \
             [ -z "${{ secrets.IOS_TEAM_ID }}" ] || \
             [ -z "${{ secrets.IOS_KEYCHAIN_PASSWORD }}" ]; then
            echo "iOS signing secrets are not configured; skipping the signed release build."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.secrets_check.outputs.configured == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        if: steps.secrets_check.outputs.configured == 'true'
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.secrets_check.outputs.configured == 'true'
        with:
          cache-on-failure: true
          workspaces: |
            ./src-tauri -> target

      - name: Install dependencies
        if: steps.secrets_check.outputs.configured == 'true'
        run: npm ci

      - name: Init iOS project
        if: steps.secrets_check.outputs.configured == 'true'
        run: npm run mobile:ios:init

      # iOS release signing: import the distribution certificate into a
      # temporary, CI-only keychain (the standard approach for codesigning
      # on GitHub-hosted macOS runners - a fresh keychain avoids polluting
      # or depending on the runner's default one) and install the
      # provisioning profile where Xcode's build system looks for it
      # (~/Library/MobileDevice/Provisioning Profiles). `tauri ios build`
      # shells out to `xcodebuild`, which then picks both up automatically
      # by matching the profile's bundle identifier and team.
      - name: Import signing certificate and provisioning profile
        if: steps.secrets_check.outputs.configured == 'true'
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/treq-release-cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/treq-release.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/treq-release.keychain-db"

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Make this keychain visible to codesign alongside the runner's
          # default keychains, rather than replacing the search list.
          EXISTING_KEYCHAINS=$(security list-keychains -d user | sed 's/"//g')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/treq-release.mobileprovision

          echo "IOS_RELEASE_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build signed release archive/IPA
        if: steps.secrets_check.outputs.configured == 'true'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: npm run mobile:ios:build

      - name: Remove temporary keychain
        if: always() && steps.secrets_check.outputs.configured == 'true'
        run: |
          if [ -n "${IOS_RELEASE_KEYCHAIN:-}" ]; then
            security delete-keychain "$IOS_RELEASE_KEYCHAIN" || true
          fi

      - name: Upload signed release artifacts
        if: steps.secrets_check.outputs.configured == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ios-release-signed
          path: src-tauri/gen/apple/build/**
          if-no-files-found: error
