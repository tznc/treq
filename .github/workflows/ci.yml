name: CI

defaults:
  run:
    shell: bash

env:
  # Disable incremental compilation for faster from-scratch builds
  CARGO_INCREMENTAL: 0
  # Skip debug info for test binaries: faster builds, smaller artifacts
  CARGO_PROFILE_TEST_DEBUG: 0
  # Line tables keep backtraces readable for less compile and link time.
  # warm-caches.yml sets the same env, so its cache keys match.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

on:
  pull_request:
    # ready_for_review runs the heavy jobs that drafts skip.
    types: [opened, synchronize, reopened, ready_for_review]

# A new push supersedes the previous run; free its runners for other PRs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # One job for both filters: each extra job waits for its own runner before
  # anything downstream can start.
  detect-changes:
    timeout-minutes: 15
    name: detect changes
    runs-on: ubuntu-22.04
    outputs:
      rust_changed: ${{ steps.filter.outputs.rust }}
      js_changed: ${{ steps.filter.outputs.js }}
      e2e_changed: ${{ steps.filter.outputs.e2e }}
    # No checkout: on pull_request, paths-filter lists the changed files
    # through the GitHub API.
    permissions:
      pull-requests: read
    steps:
      - name: Check for Rust and JS/TS changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - "src-tauri/**"
              - "crates/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - ".config/nextest.toml"
              - "deny.toml"
              - ".github/workflows/ci.yml"
            js:
              - "*.{js,ts,mjs,cjs,mts,cts}"
              - "scripts/**"
              - "test/**"
              - "supabase/functions/**"
              - "package.json"
              - "package-lock.json"
              - "biome.json"
              - "sgconfig.yml"
              - ".tool-versions"
              - "_typos.toml"
              - ".github/workflows/ci.yml"
            e2e:
              - "e2e/desktop/**"

  # One job for the quick lint/format/type checks and the unit tests. Each
  # check takes seconds; as separate jobs each one paid ~30s of setup and its
  # own runner.
  # Every check runs even if an earlier one fails (!cancelled()).
  verify:
    needs: detect-changes
    if: needs.detect-changes.outputs.js_changed == 'true' || needs.detect-changes.outputs.rust_changed == 'true'
    timeout-minutes: 15
    name: verify / ubuntu-22.04
    runs-on: ubuntu-22.04
    env:
      JS: ${{ needs.detect-changes.outputs.js_changed }}
      RUST: ${{ needs.detect-changes.outputs.rust_changed }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: check
        if: ${{ !cancelled() && env.JS == 'true' }}
        run: npm run check

      - name: check:format
        if: ${{ !cancelled() && env.JS == 'true' }}
        run: npm run check:format

      # lint runs ast-grep rules over src-tauri, so it also runs on Rust changes.
      - name: lint
        if: ${{ !cancelled() }}
        run: npm run lint

      # Edge functions run on Deno: type-check them and run the Deno unit
      # tests (remote_e2e.test.ts is the live suite in remote-e2e.yml).
      - name: Setup Deno
        if: ${{ !cancelled() && env.JS == 'true' }}
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.5.6
          cache: true

      - name: check:functions
        if: ${{ !cancelled() && env.JS == 'true' }}
        run: npm run check:functions

      - name: test:functions
        if: ${{ !cancelled() && env.JS == 'true' }}
        run: npm run test:functions

      # The Supabase-side unit tests (billing, Linear proxy).
      # They share this job's npm ci instead of paying for their own runner.
      - name: test
        if: ${{ !cancelled() && env.JS == 'true' }}
        run: npm test

      - name: Install rustfmt
        if: ${{ !cancelled() && env.RUST == 'true' }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          components: rustfmt
          toolchain: stable

      - name: rustfmt
        if: ${{ !cancelled() && env.RUST == 'true' }}
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Install typos and cargo-machete
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: typos,cargo-machete

      # Spelling across code and docs (_typos.toml).
      - name: typos
        if: ${{ !cancelled() }}
        run: typos

      # Unused Cargo dependencies.
      - name: cargo-machete
        if: ${{ !cancelled() && env.RUST == 'true' }}
        run: cargo machete

  # Heavy jobs skip draft PRs; marking the PR ready for review runs them.
  #
  # The end-to-end suite (e2e/desktop): the app built with the `e2e`
  # feature, which embeds a Playwright server (gpui-playwright), driven by
  # stock @playwright/test under Xvfb on a fixture repository. The desktop
  # UI tests (gpui-testing-library) are lib tests, so test-rust's nextest
  # run covers them.
  test-desktop-e2e:
    needs: detect-changes
    if: ${{ !github.event.pull_request.draft && (needs.detect-changes.outputs.rust_changed == 'true' || needs.detect-changes.outputs.e2e_changed == 'true') }}
    timeout-minutes: 20
    name: test-desktop-e2e / playwright / ubuntu-22.04
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Use mold linker
        uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1

      # test-rust's packages, plus Xvfb and Mesa's software Vulkan
      # (lavapipe), which GPUI renders with on a runner without a GPU, and
      # xdotool, which presses keys through X for the text shortcut tests.
      - name: install dependencies (ubuntu only)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev libgbm-dev libegl-dev libxdo-dev xvfb mesa-vulkan-drivers xdotool
          version: webkit-4.1-gpui-e2e-2
          execute_install_scripts: true

      # Reads test-rust's cache (warm-caches.yml saves it on main); the
      # dependencies build the same, only treq itself differs.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: false
          workspaces: |
            . -> target

      - name: Build the app with the e2e feature
        working-directory: src-tauri
        run: cargo build --locked --features e2e --bin treq

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/desktop/package-lock.json

      - name: Install the suite
        working-directory: e2e/desktop
        run: npm ci

      - name: Type-check the suite
        working-directory: e2e/desktop
        run: npm run -s typecheck

      - name: Run the e2e suite under Xvfb
        working-directory: e2e/desktop
        env:
          TREQ_E2E_BIN: ${{ github.workspace }}/target/debug/treq
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm test

      - name: Upload the report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-e2e-report
          path: |
            e2e/desktop/playwright-report
            e2e/desktop/test-results
          retention-days: 7

  # clippy and the Rust tests share one job: each takes 1-2 min on a warm
  # cache, so a second job only paid for another runner and setup.
  # Advisories, licenses, crate sources and duplicates (deny.toml).
  cargo-deny:
    needs: detect-changes
    if: ${{ !github.event.pull_request.draft && needs.detect-changes.outputs.rust_changed == 'true' }}
    timeout-minutes: 10
    name: cargo-deny / ubuntu-22.04
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-deny
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny

      - name: cargo deny
        run: cargo deny --locked check

  test-rust:
    needs: detect-changes
    if: ${{ !github.event.pull_request.draft && needs.detect-changes.outputs.rust_changed == 'true' }}
    timeout-minutes: 20
    # macOS runs after merge in warm-caches.yml: macOS runners are the
    # scarcest and slowest, and the tests rarely differ by platform.
    name: test-rust / clippy + test / ubuntu-22.04
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          components: rustfmt, clippy
          toolchain: stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest

      # mold links the large test binaries several times faster than ld.
      - name: Use mold linker
        uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1

      # Cold apt install of WebKit/GTK is ~30–60s per job; restore from Actions
      # cache on subsequent runs. execute_install_scripts is required so dpkg
      # postinst (ldconfig, alternatives) still runs on restore.
      - name: install dependencies (ubuntu only)
        # Tauri links WebKit/GTK; GPUI needs the X11/Wayland/Vulkan libraries.
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev libgbm-dev libegl-dev libxdo-dev mesa-vulkan-drivers
          version: webkit-4.1-gpui-2
          execute_install_scripts: true

      # Runners already ship git + gh. Only jj needs installing; cache the
      # release binary (macOS brew of git/jj/gh was ~40s every run).
      - name: Resolve jj release tag
        id: jj
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jj-vcs/jj/releases/latest | jq -r .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Restore jj CLI cache
        id: jj-cache
        uses: actions/cache/restore@v6
        with:
          path: .ci-bin
          key: jj-${{ runner.os }}-${{ runner.arch }}-${{ steps.jj.outputs.tag }}

      - name: Install jj CLI
        if: steps.jj-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JJ_TAG: ${{ steps.jj.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p .ci-bin
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)   target=x86_64-unknown-linux-musl ;;
            macOS-ARM64) target=aarch64-apple-darwin ;;
            macOS-X64)   target=x86_64-apple-darwin ;;
            Windows-X64) target=x86_64-pc-windows-msvc ;;
            *)
              echo "unsupported runner: ${{ runner.os }}-${{ runner.arch }}"
              exit 1
              ;;
          esac
          if [ "${{ runner.os }}" = "Windows" ]; then
            asset="jj-${JJ_TAG}-${target}.zip"
            tmp=$(mktemp -d)
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -L "https://github.com/jj-vcs/jj/releases/download/${JJ_TAG}/${asset}" \
              -o "$tmp/jj.zip"
            unzip -q "$tmp/jj.zip" -d "$tmp"
            jj_bin=$(find "$tmp" -type f -name jj.exe | head -n 1)
            test -n "$jj_bin"
            install -m 755 "$jj_bin" .ci-bin/jj.exe
          else
            asset="jj-${JJ_TAG}-${target}.tar.gz"
            tmp=$(mktemp -d)
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -L "https://github.com/jj-vcs/jj/releases/download/${JJ_TAG}/${asset}" \
              | tar -xz -C "$tmp"
            # tarball may nest the binary; find it
            jj_bin=$(find "$tmp" -type f -name jj | head -n 1)
            test -n "$jj_bin"
            install -m 755 "$jj_bin" .ci-bin/jj
          fi

      - name: Save jj CLI cache
        if: steps.jj-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .ci-bin
          key: ${{ steps.jj-cache.outputs.cache-primary-key }}

      - name: Add jj to PATH
        run: echo "$GITHUB_WORKSPACE/.ci-bin" >> "$GITHUB_PATH"

      - name: Verify tool versions
        run: |
          git --version
          jj --version
          gh --version

      # Restores the cache warm-caches.yml saves on main. PR runs don't save:
      # a PR's cache can only be read by that PR, and the multi-GB saves
      # evict main's caches from the repo's 10 GB quota.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target

      # No separate `cargo check`: clippy --all-targets runs the same checks.
      # rustfmt runs in the verify job.
      - name: clippy
        working-directory: src-tauri
        env:
          RUST_BACKTRACE: 1
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      # Runs even when clippy fails, so one push reports both.
      - name: Run Rust tests
        if: ${{ !cancelled() }}
        working-directory: src-tauri
        env:
          RUST_BACKTRACE: 1
        run: cargo nextest run --locked --workspace --profile ci
