name: CI

defaults:
  run:
    shell: bash

env:
  # Disable incremental compilation for faster from-scratch builds
  CARGO_INCREMENTAL: 0
  # Skip debug info for test binaries: faster builds, smaller artifacts
  CARGO_PROFILE_TEST_DEBUG: 0

on:
  pull_request:

# A new push supersedes the previous run; free its runners for other PRs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-windows-changes:
    timeout-minutes: 10
    name: detect windows-specific changes
    runs-on: ubuntu-22.04
    outputs:
      windows_changed: ${{ steps.detect.outputs.windows_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The windows-rust job is slow and only ever catches
      # bugs in code that branches on the Windows target. Skip it unless
      # the diff actually touches windows-specific cfg branching so most
      # PRs don't pay for it.
      - name: Check for windows-specific branching in the diff
        id: detect
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --unified=0 "$base...$head" -- 'src-tauri/**/*.rs' \
              | grep -qE '^\+.*(cfg\(target_os = "windows"\)|cfg\(windows\)|cfg!\(windows\)|cfg!\(target_os = "windows"\))'; then
            echo "windows_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows_changed=false" >> "$GITHUB_OUTPUT"
          fi

  detect-rust-changes:
    timeout-minutes: 10
    name: detect rust changes
    runs-on: ubuntu-22.04
    outputs:
      rust_changed: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for src-tauri/Cargo changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - "src-tauri/**"
              - "crates/tauri-test-macros/**"
              - "Cargo.toml"
              - "Cargo.lock"

  detect-js-changes:
    timeout-minutes: 10
    name: detect js changes
    runs-on: ubuntu-22.04
    outputs:
      js_changed: ${{ steps.filter.outputs.js }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for JS/TS source and tooling config changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            js:
              - "*.{js,ts,mjs,cjs,mts,cts}"
              - "scripts/**"
              - "src/**"
              - "test/**"
              - "eslint-rules/**"
              - "package.json"
              - "package-lock.json"
              - "tsconfig*.json"
              - "biome.json"
              - ".oxlintrc.json"
              - "knip.json"
              - "sgconfig.yml"
              - ".tool-versions"
              - ".github/workflows/ci.yml"

  verify-js:
    # lint runs ast-grep rules over src-tauri, so it also runs on Rust changes.
    needs: [detect-js-changes, detect-rust-changes]
    if: needs.detect-js-changes.outputs.js_changed == 'true' || needs.detect-rust-changes.outputs.rust_changed == 'true'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            task: check
          - platform: ubuntu-22.04
            task: check:format
          - platform: ubuntu-22.04
            task: lint
            rust: true
          - platform: ubuntu-22.04
            task: knip
    name: verify-js / ${{ matrix.task }} / ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    env:
      # Matrix entries flagged rust: true also run on Rust-only changes.
      RUN_TASK: ${{ needs.detect-js-changes.outputs.js_changed == 'true' || matrix.rust == true }}
    steps:
      - uses: actions/checkout@v4
        if: env.RUN_TASK == 'true'

      - name: Setup Node.js
        if: env.RUN_TASK == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: env.RUN_TASK == 'true'
        run: npm ci

      - name: Run JS task
        if: env.RUN_TASK == 'true'
        run: npm run ${{ matrix.task }}

  test-js:
    # test:integration drives the Rust commands via NAPI, so it also runs on
    # Rust changes.
    needs: [detect-js-changes, detect-rust-changes]
    if: needs.detect-js-changes.outputs.js_changed == 'true' || needs.detect-rust-changes.outputs.rust_changed == 'true'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Unit tests: mocked Tauri, no NAPI/jj. Parallel file execution.
          - platform: ubuntu-22.04
            task: test:unit
          # Integration tests: NAPI + real jj repos. Serial file execution.
          - platform: ubuntu-22.04
            task: test:integration
            rust: true
          - platform: windows-latest
            task: test:unit
    name: test-js / ${{ matrix.task }} / ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    env:
      # Matrix entries flagged rust: true also run on Rust-only changes.
      RUN_TASK: ${{ needs.detect-js-changes.outputs.js_changed == 'true' || matrix.rust == true }}
    steps:
      - uses: actions/checkout@v4
        if: env.RUN_TASK == 'true'

      - name: Setup Node.js
        if: env.RUN_TASK == 'true'
        id: setup-node
        uses: actions/setup-node@v4
        with:
          # Pin major so NAPI cache keys stay stable across LTS patch bumps.
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      # Cold apt install of WebKit/GTK is ~30–60s per job; restore from Actions
      # cache on subsequent runs. execute_install_scripts is required so dpkg
      # postinst (ldconfig, alternatives) still runs on restore.
      - name: install dependencies (ubuntu only)
        # WebKit/GTK is needed to *dlopen* libtreq_lib.so in integration tests
        # even on a NAPI cache hit.
        if: env.RUN_TASK == 'true' && (matrix.platform == 'ubuntu-22.04' && matrix.task == 'test:integration')
        uses: awalsh128/cache-apt-pkgs-action@v1.6.1
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: webkit-4.1-1
          execute_install_scripts: true

      # Runners already ship git + gh. Only jj needs installing; cache the
      # release binary (macOS brew of git/jj/gh was ~40s every run).
      - name: Resolve jj release tag
        id: jj
        if: env.RUN_TASK == 'true' && (matrix.task == 'test:integration')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jj-vcs/jj/releases/latest | jq -r .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Restore jj CLI cache
        id: jj-cache
        if: env.RUN_TASK == 'true' && (matrix.task == 'test:integration')
        uses: actions/cache/restore@v4
        with:
          path: .ci-bin
          key: jj-${{ runner.os }}-${{ runner.arch }}-${{ steps.jj.outputs.tag }}

      - name: Install jj CLI
        if: env.RUN_TASK == 'true' && (matrix.task == 'test:integration' && steps.jj-cache.outputs.cache-hit != 'true')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JJ_TAG: ${{ steps.jj.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p .ci-bin
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)   target=x86_64-unknown-linux-musl ;;
            macOS-ARM64) target=aarch64-apple-darwin ;;
            macOS-X64)   target=x86_64-apple-darwin ;;
            Windows-X64) target=x86_64-pc-windows-msvc ;;
            *)
              echo "unsupported runner: ${{ runner.os }}-${{ runner.arch }}"
              exit 1
              ;;
          esac
          if [ "${{ runner.os }}" = "Windows" ]; then
            asset="jj-${JJ_TAG}-${target}.zip"
            tmp=$(mktemp -d)
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -L "https://github.com/jj-vcs/jj/releases/download/${JJ_TAG}/${asset}" \
              -o "$tmp/jj.zip"
            unzip -q "$tmp/jj.zip" -d "$tmp"
            jj_bin=$(find "$tmp" -type f -name jj.exe | head -n 1)
            test -n "$jj_bin"
            install -m 755 "$jj_bin" .ci-bin/jj.exe
          else
            asset="jj-${JJ_TAG}-${target}.tar.gz"
            tmp=$(mktemp -d)
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -L "https://github.com/jj-vcs/jj/releases/download/${JJ_TAG}/${asset}" \
              | tar -xz -C "$tmp"
            # tarball may nest the binary; find it
            jj_bin=$(find "$tmp" -type f -name jj | head -n 1)
            test -n "$jj_bin"
            install -m 755 "$jj_bin" .ci-bin/jj
          fi

      - name: Save jj CLI cache
        if: env.RUN_TASK == 'true' && (matrix.task == 'test:integration' && steps.jj-cache.outputs.cache-hit != 'true')
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ci-bin
          key: ${{ steps.jj-cache.outputs.cache-primary-key }}

      - name: Add jj to PATH
        if: env.RUN_TASK == 'true' && (matrix.task == 'test:integration')
        run: echo "$GITHUB_WORKSPACE/.ci-bin" >> "$GITHUB_PATH"

      - name: Verify tool versions
        if: env.RUN_TASK == 'true' && (matrix.task == 'test:integration')
        run: |
          git --version
          jj --version
          gh --version

      # Integration suite time varies about 1.8x between hosted runners for
      # the same commit. Log the hardware so a slow run can be told apart
      # from a code regression.
      - name: Runner hardware
        if: env.RUN_TASK == 'true' && (matrix.task == 'test:integration')
        run: |
          nproc
          grep -m1 'model name' /proc/cpuinfo || true
          free -m

      - name: Install dependencies
        if: env.RUN_TASK == 'true'
        run: npm ci

      # Vitest's on-disk module cache (experimental.fsModuleCache in
      # vitest.integration.base.ts). Restored after `npm ci`, which empties
      # node_modules. Entries are keyed by file content, so a cache from an
      # older commit is safe to reuse; the key only picks the newest one.
      - name: Vitest module cache
        if: env.RUN_TASK == 'true' && (matrix.task == 'test:integration')
        uses: actions/cache@v4
        with:
          path: node_modules/.experimental-vitest-cache
          key: vitest-fsmc-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            vitest-fsmc-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # Restores the addon built on main (napi-cache.yml) or builds it.
      - name: NAPI addon
        if: env.RUN_TASK == 'true' && (matrix.task == 'test:integration')
        uses: ./.github/actions/napi-addon

      - name: Run JS task
        if: env.RUN_TASK == 'true'
        run: |
          if [ "${{ matrix.task }}" = "test:integration" ]; then
            npm run test:integration:run
          else
            npm run ${{ matrix.task }}
          fi

  verify-rust:
    needs: detect-rust-changes
    if: needs.detect-rust-changes.outputs.rust_changed == 'true'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # No separate `check`: clippy --all-targets runs the same checks.
        task: [fmt, clippy]
    name: verify-rust / ${{ matrix.task }} / ubuntu-22.04
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@v1
        with:
          components: rustfmt, clippy
          toolchain: stable

      # Cold apt install of WebKit/GTK is ~30–60s per job; restore from Actions
      # cache on subsequent runs. execute_install_scripts is required so dpkg
      # postinst (ldconfig, alternatives) still runs on restore.
      - name: install dependencies (ubuntu only)
        # WebKit/GTK is needed to *link* treq/tauri.
        uses: awalsh128/cache-apt-pkgs-action@v1.6.1
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: webkit-4.1-1
          execute_install_scripts: true

      - name: Install dependencies
        run: npm ci

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target

      - name: Run Rust task
        working-directory: src-tauri
        env:
          RUST_BACKTRACE: 1
        run: |
          case "${{ matrix.task }}" in
            fmt)
              cargo fmt --check
              ;;
            clippy)
              cargo clippy --locked --all-targets --all-features -- -D warnings
              ;;
          esac

  test-rust:
    needs: detect-rust-changes
    if: needs.detect-rust-changes.outputs.rust_changed == 'true'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest]
    name: test-rust / test / ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@v1
        with:
          components: rustfmt, clippy
          toolchain: stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # Cold apt install of WebKit/GTK is ~30–60s per job; restore from Actions
      # cache on subsequent runs. execute_install_scripts is required so dpkg
      # postinst (ldconfig, alternatives) still runs on restore.
      - name: install dependencies (ubuntu only)
        # WebKit/GTK is needed to *link* treq/tauri and to *dlopen*
        # libtreq_lib.so in tests.
        if: matrix.platform == 'ubuntu-22.04'
        uses: awalsh128/cache-apt-pkgs-action@v1.6.1
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: webkit-4.1-1
          execute_install_scripts: true

      # Runners already ship git + gh. Only jj needs installing; cache the
      # release binary (macOS brew of git/jj/gh was ~40s every run).
      - name: Resolve jj release tag
        id: jj
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jj-vcs/jj/releases/latest | jq -r .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Restore jj CLI cache
        id: jj-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-bin
          key: jj-${{ runner.os }}-${{ runner.arch }}-${{ steps.jj.outputs.tag }}

      - name: Install jj CLI
        if: steps.jj-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JJ_TAG: ${{ steps.jj.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p .ci-bin
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)   target=x86_64-unknown-linux-musl ;;
            macOS-ARM64) target=aarch64-apple-darwin ;;
            macOS-X64)   target=x86_64-apple-darwin ;;
            Windows-X64) target=x86_64-pc-windows-msvc ;;
            *)
              echo "unsupported runner: ${{ runner.os }}-${{ runner.arch }}"
              exit 1
              ;;
          esac
          if [ "${{ runner.os }}" = "Windows" ]; then
            asset="jj-${JJ_TAG}-${target}.zip"
            tmp=$(mktemp -d)
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -L "https://github.com/jj-vcs/jj/releases/download/${JJ_TAG}/${asset}" \
              -o "$tmp/jj.zip"
            unzip -q "$tmp/jj.zip" -d "$tmp"
            jj_bin=$(find "$tmp" -type f -name jj.exe | head -n 1)
            test -n "$jj_bin"
            install -m 755 "$jj_bin" .ci-bin/jj.exe
          else
            asset="jj-${JJ_TAG}-${target}.tar.gz"
            tmp=$(mktemp -d)
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -L "https://github.com/jj-vcs/jj/releases/download/${JJ_TAG}/${asset}" \
              | tar -xz -C "$tmp"
            # tarball may nest the binary; find it
            jj_bin=$(find "$tmp" -type f -name jj | head -n 1)
            test -n "$jj_bin"
            install -m 755 "$jj_bin" .ci-bin/jj
          fi

      - name: Save jj CLI cache
        if: steps.jj-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ci-bin
          key: ${{ steps.jj-cache.outputs.cache-primary-key }}

      - name: Add jj to PATH
        run: echo "$GITHUB_WORKSPACE/.ci-bin" >> "$GITHUB_PATH"

      - name: Verify tool versions
        run: |
          git --version
          jj --version
          gh --version

      - name: Install dependencies
        run: npm ci

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target

      - name: Run Rust task
        working-directory: src-tauri
        env:
          RUST_BACKTRACE: 1
        run: cargo nextest run --locked --no-fail-fast

  # Windows rust tests are slow and only ever catch bugs in code that
  # branches on the Windows target, so they're gated on detect-windows-changes
  # finding windows-specific cfg branching in the diff instead of running on
  # every PR.
  windows-rust-tests:
    needs: detect-windows-changes
    if: needs.detect-windows-changes.outputs.windows_changed == 'true'
    name: rust / test / windows-latest
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      # Windows Defender's real-time scanning intercepts every process spawn
      # and file write; this job spawns hundreds of jj/git subprocesses per
      # test run, so this materially cuts wall time. Exclude the workspace
      # before checkout writes anything into it.
      - name: Disable Defender scanning
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@v1
        with:
          components: rustfmt
          toolchain: stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # windows-latest runners ship LLVM (lld-link.exe) but link.exe from MSVC
      # is the default; switch to lld for a much faster linker on Windows.
      - name: Use lld linker
        run: |
          echo "RUSTFLAGS=-C linker=lld-link" >> "$GITHUB_ENV"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure sccache
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      # Runners already ship git + gh. Only jj needs installing; cache the
      # release binary.
      - name: Resolve jj release tag
        id: jj
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jj-vcs/jj/releases/latest | jq -r .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Restore jj CLI cache
        id: jj-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-bin
          key: jj-${{ runner.os }}-${{ runner.arch }}-${{ steps.jj.outputs.tag }}

      - name: Install jj CLI
        if: steps.jj-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JJ_TAG: ${{ steps.jj.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p .ci-bin
          asset="jj-${JJ_TAG}-x86_64-pc-windows-msvc.zip"
          tmp=$(mktemp -d)
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -L "https://github.com/jj-vcs/jj/releases/download/${JJ_TAG}/${asset}" \
            -o "$tmp/jj.zip"
          unzip -q "$tmp/jj.zip" -d "$tmp"
          jj_bin=$(find "$tmp" -type f -name jj.exe | head -n 1)
          test -n "$jj_bin"
          install -m 755 "$jj_bin" .ci-bin/jj.exe

      - name: Save jj CLI cache
        if: steps.jj-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ci-bin
          key: ${{ steps.jj-cache.outputs.cache-primary-key }}

      - name: Add jj to PATH
        run: echo "$GITHUB_WORKSPACE/.ci-bin" >> "$GITHUB_PATH"

      - name: Verify tool versions
        run: |
          git --version
          jj --version
          gh --version

      - name: Install dependencies
        run: npm ci

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target

      - name: Run Rust task
        working-directory: src-tauri
        env:
          RUST_BACKTRACE: 1
        run: cargo nextest run --locked --no-fail-fast
