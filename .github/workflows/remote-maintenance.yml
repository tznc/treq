name: Remote maintenance

# Runs the remote-admin jobs that have no in-database scheduler (this project
# has no pg_cron). See remote-admin/index.ts for what each action does. All
# no-op until the secrets exist.

on:
  schedule:
    # Keep in sync with the case table below.
    - cron: "7 * * * *" # hourly, after build_usage_reports' 5 min wait for late intervals
    - cron: "17 * * * *"
    - cron: "23 3 * * *"
    - cron: "41 * * * *"
    - cron: "*/5 * * * *" # GitHub's minimum
    - cron: "2,32,47 * * * *" # with :17, spend caps every 15 min
  workflow_dispatch:
    inputs:
      action:
        description: remote-admin action to run
        required: true
        type: choice
        options:
          - sweep_lapsed_instances
          - prune_audit_events
          - report_usage
          - enforce_spend_caps
          - advance_migrations
          - destroy_retired_placements
          - recompute_defaults
          - enforce_idle

# One group per schedule: a pending run in a group is replaced by the next
# one, so the 5-minute idle run must not share a group with the hourly ones.
concurrency:
  group: remote-maintenance-${{ github.event.schedule || inputs.action }}
  cancel-in-progress: false

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call remote-admin
        env:
          REMOTE_ADMIN_URL: ${{ secrets.REMOTE_ADMIN_URL }}
          REMOTE_ADMIN_API_KEY: ${{ secrets.REMOTE_ADMIN_API_KEY }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_ACTION: ${{ inputs.action }}
        run: |
          if [ -z "$REMOTE_ADMIN_URL" ] || [ -z "$REMOTE_ADMIN_API_KEY" ]; then
            echo "::notice::REMOTE_ADMIN_URL or REMOTE_ADMIN_API_KEY is not set; skipping."
            exit 0
          fi
          case "$SCHEDULE" in
            "")                actions="$INPUT_ACTION" ;;
            "7 * * * *")       actions="report_usage" ;;
            "17 * * * *")      actions="sweep_lapsed_instances enforce_spend_caps" ;;
            "23 3 * * *")      actions="prune_audit_events" ;;
            "41 * * * *")      actions="advance_migrations destroy_retired_placements" ;;
            "*/5 * * * *")     actions="enforce_idle" ;;
            "2,32,47 * * * *") actions="enforce_spend_caps" ;;
            *) echo "::error::no actions for schedule '$SCHEDULE'"; exit 1 ;;
          esac
          for a in $actions; do
            echo "Running $a"
            out=$(curl --fail-with-body --silent --show-error --max-time 300 \
              -X POST "$REMOTE_ADMIN_URL" \
              -H "x-admin-api-key: $REMOTE_ADMIN_API_KEY" \
              -H "content-type: application/json" \
              --data "{\"action\":\"$a\"}")
            echo "$out"
            # These need a person: usage rows unsent an hour after their hour
            # ended or given up on, and parked drains past their deadline
            # (never forced automatically; see force_migration).
            if printf '%s' "$out" | grep -qE '"(late|dead)":[1-9]'; then
              echo "::warning::report_usage has late or dead usage reports; see the function logs"
            fi
            if printf '%s' "$out" | grep -q '"overdue":\[{'; then
              echo "::warning::advance_migrations reports overdue parked migrations"
            fi
          done
