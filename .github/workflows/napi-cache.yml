name: NAPI addon cache

# ci.yml only runs on pull_request, and Actions caches saved from a PR are
# scoped to that PR's ref: no other PR can restore them. Building on main
# saves the NAPI addon and rust-cache under the default branch, which every
# PR can read, so frontend-only PRs skip the ~4 minute addon build.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: napi-cache
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build NAPI addon
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: install dependencies (ubuntu only)
        uses: awalsh128/cache-apt-pkgs-action@v1.6.1
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: webkit-4.1-1
          execute_install_scripts: true

      - name: Install dependencies
        run: npm ci

      - uses: ./.github/actions/napi-addon
