# TEMP: validates nightly.yml mobile jobs on this PR. Remove before merge.
name: TEMP nightly mobile check
'on':
  pull_request: null
  workflow_dispatch: null
defaults:
  run:
    shell: bash
jobs:
  android:
    name: android build (gpui, unsigned debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: 0
      NDK_VERSION: 27.0.12077973
    steps:
    - uses: actions/checkout@v4
    - name: Free disk space
      run: 'sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"

        df -h /

        '
    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android
    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        key: nightly-android
        workspaces: ./mobile-gpui -> target
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: Install NDK
      run: 'sdkmanager --install "ndk;$NDK_VERSION"

        echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

        '
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Placeholder frontend dist
      run: mkdir -p src/dist && echo '<!doctype html>' > src/dist/index.html
    - name: Track tauri-gpui main
      working-directory: mobile-gpui
      run: cargo update -p tauri-plugin-gpui
    - name: Build debug APK
      working-directory: mobile-gpui
      run: 'npm install --no-audit --no-fund

        npm run tauri -- android init --ci

        npm run tauri -- android build --debug --apk --target aarch64 --ci

        apk=$(find gen/android/app/build/outputs/apk -name ''*.apk'' | head -n1)

        test -n "$apk"

        ls -la "$apk"

        cp "$apk" "$GITHUB_WORKSPACE/treq-nightly-android-arm64.apk"

        '
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-debug-apk
        path: treq-nightly-android-arm64.apk
        if-no-files-found: error
        retention-days: 7
  ios:
    name: ios build (gpui, unsigned debug)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-apple-ios,aarch64-apple-ios-sim
    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        key: nightly-ios
        workspaces: ./mobile-gpui -> target
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Placeholder frontend dist
      run: mkdir -p src/dist && echo '<!doctype html>' > src/dist/index.html
    - name: Prepare the crate for iOS
      working-directory: mobile-gpui
      run: 'cargo update -p tauri-plugin-gpui

        cargo update -p libc --precise 0.2.189

        sed -i.bak ''s/^crate-type = .*/crate-type = ["staticlib", "rlib"]/'' Cargo.toml

        grep -qx ''crate-type = \["staticlib", "rlib"\]'' Cargo.toml

        rm Cargo.toml.bak

        '
    - name: Build debug app bundle (simulator)
      working-directory: mobile-gpui
      run: 'command -v xcodegen >/dev/null || brew install xcodegen

        npm install --no-audit --no-fund

        npm run tauri -- ios init --ci

        npm run tauri -- ios build --debug --target aarch64-sim --no-sign --ci

        app=$(find gen/apple/build -name ''*.app'' -path ''*arm64-sim*'' -maxdepth 3 | head -n 1)

        test -n "$app"

        ditto "$app" "$RUNNER_TEMP/app/$(basename "$app")"

        '
    - name: Upload app bundle
      uses: actions/upload-artifact@v4
      with:
        name: ios-debug-app
        path: ${{ runner.temp }}/app
        if-no-files-found: error
        retention-days: 7
