# End-to-end tests of the GPUI desktop app (e2e/desktop): the app is built
# with the `e2e` feature, which embeds a Playwright server (gpui-playwright),
# and stock @playwright/test drives it under Xvfb on a fixture repository.
#
# The Rust UI tests (gpui-testing-library) are lib tests, so ci.yml's
# test-rust job already runs them with `cargo nextest run`.
name: desktop-e2e

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "e2e/desktop/**"
      - ".github/workflows/desktop-e2e.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desktop-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: ${{ !github.event.pull_request.draft }}
    name: desktop-e2e / ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Use mold linker
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1

      # The app's build dependencies, plus Xvfb and Mesa's software Vulkan
      # (lavapipe), which GPUI renders with on a runner without a GPU.
      - name: Install system packages
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f # v1.6.1
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev libgbm-dev libegl-dev libxdo-dev xvfb mesa-vulkan-drivers
          version: webkit-4.1-gpui-e2e-1
          execute_install_scripts: true

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: desktop-e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target

      - name: Build the app with the e2e feature
        working-directory: src-tauri
        run: cargo build --locked --features e2e --bin treq

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/desktop/package-lock.json

      - name: Install the suite
        working-directory: e2e/desktop
        run: npm ci

      - name: Type-check the suite
        working-directory: e2e/desktop
        run: npm run -s typecheck

      - name: Run the e2e suite under Xvfb
        working-directory: e2e/desktop
        env:
          TREQ_E2E_BIN: ${{ github.workspace }}/target/debug/treq
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm test

      - name: Upload the report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-report
          path: |
            e2e/desktop/playwright-report
            e2e/desktop/test-results
          retention-days: 7
