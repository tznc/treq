name: Update Skills Catalog

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: "0 6 * * 1"

defaults:
  run:
    shell: bash
    working-directory: web

permissions:
  actions: read
  contents: write

jobs:
  update-catalog:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.3"
          cache: npm
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        run: npm ci

      # Pins every source to its branch head and refreshes stars in the lock,
      # then uploads the catalog for builds. GITHUB_TOKEN raises the
      # api.github.com rate limit for the star lookups.
      - name: Update skills catalog
        uses: ./.github/actions/skills-catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ github.token }}
          args: --update
          upload: "true"

      - name: Commit and push lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skills.lock.json
          git diff --cached --quiet && echo "No changes, skipping push." && exit 0
          git commit -m "chore: refresh skills catalog"
          git push origin HEAD:main
