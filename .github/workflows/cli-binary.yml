name: CLI Binary

on:
  pull_request:
    paths:
      - "src-tauri/src/lib.rs"
      - "src-tauri/Cargo.toml"
      - "src-tauri/build.rs"
      - ".github/workflows/cli-binary.yml"

jobs:
  detect-rust-changes:
    name: detect rust changes
    runs-on: ubuntu-22.04
    outputs:
      rust_changed: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for src-tauri changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - "src-tauri/**"

  sandboxed-cli:
    name: Sandboxed macOS CLI
    needs: detect-rust-changes
    if: needs.detect-rust-changes.outputs.rust_changed == 'true'
    runs-on: macos-latest
    timeout-minutes: 35 # a Cargo.lock change misses the rust cache; a cold build takes over 20 minutes
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            ./src-tauri -> target

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Build release CLI binary
        run: cargo build --release --locked --bin treq --target aarch64-apple-darwin

      - name: Run CLI with filesystem writes denied
        run: |
          sandbox-exec \
            -p '(version 1) (allow default) (deny file-write*)' \
            target/aarch64-apple-darwin/release/treq --help > "$RUNNER_TEMP/treq-help.txt"
          grep -F "Treq - Stacking ADE" "$RUNNER_TEMP/treq-help.txt"
          grep -F "Usage: treq" "$RUNNER_TEMP/treq-help.txt"

      - name: Build and verify packaged app
        run: |
          npm run tauri build -- --target aarch64-apple-darwin --bundles app
          codesign --force --deep --sign - target/aarch64-apple-darwin/release/bundle/macos/Treq.app
          bash scripts/verify-macos-bundle.sh target/aarch64-apple-darwin/release/bundle/macos/Treq.app

  headless-linux-cli:
    name: Headless Linux CLI
    needs: detect-rust-changes
    if: needs.detect-rust-changes.outputs.rust_changed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Install musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            ./src-tauri -> target
          key: musl

      # Same build as the release's linux-cli job, without the webkit/gtk
      # packages: the build fails if a desktop dependency leaks back in.
      - name: Build headless CLI
        run: |
          sed -i 's/^crate-type = .*/crate-type = ["rlib"]/' src-tauri/Cargo.toml
          cargo build --release --locked --no-default-features --bin treq --target x86_64-unknown-linux-musl

      - name: Run CLI in Alpine
        run: |
          docker run --rm -v "$PWD/target/x86_64-unknown-linux-musl/release/treq:/usr/local/bin/treq:ro" \
            alpine:3.20 treq --help | grep -F "Usage: treq"
