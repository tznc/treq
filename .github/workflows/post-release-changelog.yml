name: Post-Release Changelog

on:
  release:
    types: [published]

jobs:
  update-changelog:
    timeout-minutes: 15
    name: Rebuild web changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Generate changelog from GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/releases" \
              --jq '.[] | select(.draft == false and .prerelease == false)
                | "## [\(.name // .tag_name)](\(.html_url)) - \(.published_at | fromdateiso8601 | strftime("%e %B %Y") | ltrimstr(" "))\n\n\(.body // "" | gsub("\r"; "") | gsub("(?m)^#"; "##"))\n"' \
            > "$RUNNER_TEMP/releases.md"

      - name: Generate web changelog page
        run: |
          {
            printf -- '---\ntitle: Changelog\ndescription: Release history for Treq\nhide_table_of_contents: true\nwrapperClassName: changelog-page\n---\n\n'
            printf "import ContentPageLayout from '@site/src/components/ContentPageLayout';\n\n"
            printf 'export const toc = [];\n\n'
            printf "<ContentPageLayout toc={toc} breadcrumbs={[{label: 'Home', href: '/'}, {label: 'Changelog'}]}>\n\n"
            printf '# Changelog\n\n'
            printf '> Full release history for [Treq](https://github.com/treq-dev/treq/releases).\n\n'
            sed -e 's/{/\\{/g; s/}/\\}/g; s/</\&lt;/g' "$RUNNER_TEMP/releases.md"
            printf '\n</ContentPageLayout>\n'
          } > web/src/pages/changelog.mdx

      - name: Commit and push changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/src/pages/changelog.mdx
          git diff --cached --quiet || git commit -m "chore: update changelog for ${{ github.event.release.tag_name }}"
          git push origin HEAD:main
