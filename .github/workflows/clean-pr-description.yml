name: PR Cleanup

on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: write

jobs:
  # One job, not several: each was a separate runner on every push.
  # Keeps the old title-check job id in case it is a required check.
  check-conventional-title:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Remove codex label
        if: github.event.action == 'opened'
        uses: actions-ecosystem/action-remove-labels@2ce5d41b4b6aa8503e285553f75ed56e0a40bae0 # v1.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: codex

      - name: Remove chatgpt.com link and divider
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            let body = pr.body || '';
            body = body
              .replace(/https?:\/\/chatgpt\.com\S*/g, '')
              .replace(/^---+$/gm, '')
              .replace(/\n{2,}/g, '\n')
              .trim();
            if (body !== (pr.body || '').trim()) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                body
              });
            }

      - name: Enforce conventional commit title
        uses: actions/github-script@v9
        with:
          script: |
            // Re-fetch the PR so we check the title as it is now
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            // Conventional commits: type(optional scope)!?: description
            const conventional = /^[a-z]+(\([^)]+\))?!?:\s.+/;
            if (!conventional.test(pr.title)) {
              core.setFailed(
                `PR title does not follow conventional commits format.\n` +
                `Expected: <type>[(<scope>)][!]: <description>\n` +
                `Got: "${pr.title}"`
              );
            }
