name: PR Cleanup

on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: write

jobs:
  clean-description:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Remove chatgpt.com link and divider
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            let body = pr.body || '';
            body = body
              .replace(/https?:\/\/chatgpt\.com\S*/g, '')
              .replace(/^---+$/gm, '')
              .replace(/\n{2,}/g, '\n')
              .trim();
            if (body !== (pr.body || '').trim()) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                body
              });
            }

  docs-prefix-title:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Add docs prefix if only web/ changes
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const onlyWebChanges = files.every(f => f.filename.startsWith('web/'));
            if (!onlyWebChanges) return;

            const title = pr.title;
            if (title.startsWith('docs: ')) return;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              title: `docs: ${title}`,
            });

  check-conventional-title:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: docs-prefix-title
    steps:
      - name: Enforce conventional commit title
        uses: actions/github-script@v7
        with:
          script: |
            // Re-fetch the PR so we see any title edits made by earlier jobs
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            // Conventional commits: type(optional scope)!?: description
            const conventional = /^[a-z]+(\([^)]+\))?!?:\s.+/;
            if (!conventional.test(pr.title)) {
              core.setFailed(
                `PR title does not follow conventional commits format.\n` +
                `Expected: <type>[(<scope>)][!]: <description>\n` +
                `Got: "${pr.title}"`
              );
            }
