name: Skills catalog
description: >-
  Puts the generated skills catalog in web/src/data, after npm ci in web/.
  It downloads the artifact a main run built for the same lock and generator
  code. On a miss it generates the catalog from per-source extracts cached by
  commit, so only sources whose commit changed are fetched from GitHub.
inputs:
  github-token:
    description: Token that can read this repo's Actions artifacts.
    required: true
  args:
    description: Extra arguments for the generator, such as --update.
    default: ""
  upload:
    description: Upload a freshly generated catalog as an artifact for later runs.
    default: "false"
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      run: echo "key=skills-catalog-${{ hashFiles('web/skills.lock.json', 'web/scripts/fetch-skills-catalog.mjs', 'web/plugins/skillDiscovery.js', 'web/plugins/skillPageContent.js', 'web/plugins/skillsLock.js') }}" >> "$GITHUB_OUTPUT"
    # Only artifacts from main in this repo, so a branch or fork cannot supply
    # the catalog main deploys. --update changes the lock, so it skips this.
    - id: artifact
      if: inputs.args == ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        NAME: ${{ steps.key.outputs.key }}
      run: |
        run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=20" -q '
          [.artifacts[] | select((.expired | not) and .workflow_run.head_branch == "main"
            and .workflow_run.head_repository_id == .workflow_run.repository_id)][0].workflow_run.id // empty')
        echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
    - if: steps.artifact.outputs.run-id != ''
      uses: actions/download-artifact@v8
      with:
        name: ${{ steps.key.outputs.key }}
        path: web/src/data
        run-id: ${{ steps.artifact.outputs.run-id }}
        github-token: ${{ inputs.github-token }}
    - id: restore
      if: steps.artifact.outputs.run-id == ''
      uses: actions/cache/restore@v6
      with:
        path: web/.cache/skills-catalog
        key: ${{ steps.key.outputs.key }}
        restore-keys: skills-catalog-
    # Does nothing when the artifact matched the lock.
    - shell: bash
      working-directory: web
      env:
        ARGS: ${{ inputs.args }}
      run: npm run build:skills-catalog -- $ARGS
    # Keyed after the generator runs, since --update rewrites the lock.
    - id: built
      if: steps.artifact.outputs.run-id == ''
      shell: bash
      run: echo "key=skills-catalog-${{ hashFiles('web/skills.lock.json', 'web/scripts/fetch-skills-catalog.mjs', 'web/plugins/skillDiscovery.js', 'web/plugins/skillPageContent.js', 'web/plugins/skillsLock.js') }}" >> "$GITHUB_OUTPUT"
    - if: steps.built.outputs.key != '' && steps.built.outputs.key != steps.restore.outputs.cache-matched-key
      uses: actions/cache/save@v6
      with:
        path: web/.cache/skills-catalog
        key: ${{ steps.built.outputs.key }}
    - if: inputs.upload == 'true' && steps.built.outputs.key != ''
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.built.outputs.key }}
        path: |
          web/src/data/skills.json
          web/src/data/skills-index.json
          web/src/data/skill-pages.json
          web/src/data/skills-catalog.stamp
        if-no-files-found: error
        retention-days: 90
